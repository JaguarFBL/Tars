<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- TARS - Design inspiré du film Interstellar -->
  
  <!-- Corps principal (boîtier noir) -->
  <rect x="20" y="40" width="160" height="120" rx="8" fill="#1a1a1a" stroke="#000" stroke-width="2" />
  
  <!-- Écran principal (vert TARS) -->
  <rect x="30" y="50" width="140" height="80" rx="4" fill="#000000" />
  <rect x="32" y="52" width="136" height="76" rx="2" fill="#00ff41" opacity="0.8" />
  
  <!-- Lignes de l'écran (effet matrice) -->
  <line x1="35" y1="55" x2="165" y2="55" stroke="#003300" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="65" x2="165" y2="65" stroke="#003300" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="75" x2="165" y2="75" stroke="#003300" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="85" x2="165" y2="85" stroke="#003300" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="95" x2="165" y2="95" stroke="#003300" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="105" x2="165" y2="105" stroke="#003300" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="115" x2="165" y2="115" stroke="#003300" stroke-width="1" opacity="0.6"/>
  
  <!-- Caractéristiques de l'écran -->
  <line x1="35" y1="55" x2="35" y2="125" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <line x1="55" y1="55" x2="55" y2="125" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <line x1="75" y1="55" x2="75" y2="125" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <line x1="95" y1="55" x2="95" y2="125" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <line x1="115" y1="55" x2="115" y2="125" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <line x1="135" y1="55" x2="135" y2="125" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  <line x1="155" y1="55" x2="155" y2="125" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
  
  <!-- Caméra (en haut) -->
  <circle cx="100" cy="25" r="8" fill="#2a2a2a" stroke="#00ff41" stroke-width="1.5" />
  <circle cx="100" cy="25" r="4" fill="#003300" />
  <circle cx="100" cy="25" r="2" fill="#00ff41" />
  
  <!-- Haut-parleurs (grilles) -->
  <rect x="10" y="60" width="10" height="20" fill="#2a2a2a" stroke="#00ff41" stroke-width="0.5" />
  <rect x="180" y="60" width="10" height="20" fill="#2a2a2a" stroke="#00ff41" stroke-width="0.5" />
  
  <!-- Boutons de contrôle (en bas) -->
  <rect x="40" y="170" width="15" height="15" rx="2" fill="#00ff41" opacity="0.6" />
  <rect x="60" y="170" width="15" height="15" rx="2" fill="#00ff41" opacity="0.6" />
  <rect x="80" y="170" width="15" height="15" rx="2" fill="#00ff41" opacity="0.6" />
  <rect x="120" y="170" width="15" height="15" rx="2" fill="#00ff41" opacity="0.6" />
  <rect x="140" y="170" width="15" height="15" rx="2" fill="#00ff41" opacity="0.6" />
  <rect x="160" y="170" width="15" height="15" rx="2" fill="#00ff41" opacity="0.6" />
  
  <!-- Pieds de support -->
  <rect x="60" y="190" width="20" height="5" fill="#2a2a2a" />
  <rect x="120" y="190" width="20" height="5" fill="#2a2a2a" />
  
  <!-- Texte TARS -->
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="14" fill="#00ff41" text-anchor="middle" font-weight="bold">TARS</text>
  
  <!-- Effet de lumière (optionnel) -->
  <ellipse cx="100" cy="90" rx="60" ry="30" fill="#00ff41" opacity="0.1" />
</svg>
