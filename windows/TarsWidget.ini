; Rainmeter Skin pour TARS pas tars
; Placez ce fichier dans : Documents\Rainmeter\Skins\Tars\TarsWidget.ini

[Rainmeter]
Update=1000
DynamicWindowSize=1

[Metadata]
Name=Tars Widget
Author=Votre Nom
Information=Widget pour contrôler TARS
Version=1.0

[Variables]
BackendURL=http://localhost:8000/widget
Font=Segoe UI
FontSize=12
FontColor=255,255,255
BackgroundColor=30,30,30
ButtonColor=50,50,50
ButtonHoverColor=70,70,70

; ====================================================
; ARRIÈRE-PLAN
; ====================================================
[Background]
Meter=Shape
Shape=Rectangle 0,0,200,100 | Fill Color [BackgroundColor] | StrokeWidth 1 | Stroke Color 100,100,100
DynamicVariables=1

; ====================================================
; TEXTE D'ÉTAT
; ====================================================
[StatusText]
Meter=String
X=10
Y=10
W=180
H=20
Text=TARS: Chargement...
FontFace=[Font]
FontSize=[FontSize]
FontColor=[FontColor]
StringAlign=Left
DynamicVariables=1

; ====================================================
; BOUTON
; ====================================================
[TalkButton]
Meter=String
X=10
Y=40
W=180
H=30
Text=Démarrer
FontFace=[Font]
FontSize=[FontSize]
FontColor=[FontColor]
StringAlign=Center
StringStyle=Bold
SolidColor=[ButtonColor]
DynamicVariables=1
MouseOverAction=[!SetOption TalkButton SolidColor "[ButtonHoverColor]"][!UpdateMeter TalkButton][!Redraw]
MouseLeaveAction=[!SetOption TalkButton SolidColor "[ButtonColor]"][!UpdateMeter TalkButton][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureFetch "Run"][!CommandMeasure MeasureToggle "Toggle"]

; ====================================================
; MESURE POUR RÉCUPÉRER L'ÉTAT
; ====================================================
[MeasureFetch]
Measure=Plugin
Plugin=WebParser
Url=[BackendURL]
RegExp=(?siU)"status":"(.*?)"
StringIndex=1
UpdateRate=1000
OnChangeAction=[!UpdateMeter StatusText][!Redraw]

; ====================================================
; MESURE POUR TOGGLER LE BACKEND
; ====================================================
[MeasureToggle]
Measure=Plugin
Plugin=RunCommand
Program=powershell
Parameter=Start-Process -WindowStyle Hidden -FilePath "Tars.exe" -WorkingDirectory "#CURRENTPATH#"
State=Hide

; ====================================================
; LOGIQUE POUR METTRE À JOUR LE TEXTE
; ====================================================
[StatusUpdater]
Measure=Plugin
Plugin=Lua
ScriptFile=#CURRENTPATH#\TarsWidget.lua
UpdateDivider=1
