<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7E8E6">
<title>TARS</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
/* ==========================================================
   TARS — deux designs, une seule structure.
   Tokens par design, puis ce qui diffère vraiment (slab, réponse, animation).
   ========================================================== */
:root {
  color-scheme: light;
  --bg: #E7E8E6; --panel: #EFEFED; --text: #14171A; --soft: #565C63;
  --line: rgba(20,23,26,.2); --line-2: #C9CCCF;
  --accent: #E39B2D; --on-accent: #14171A; --err: #A9472B;
  --reply: #14171A; --ink-2: #3A3F45;
  --f-disp: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --r: 2px; --ease: cubic-bezier(.2,.65,.25,1);
  --w-step: 70ms; --w-dur: 380ms;
}
html[data-design="editorial"] {
  --bg: #F2F3F0; --panel: #F2F3F0; --text: #2B2E33; --soft: #5F6B76;
  --line: rgba(43,46,51,.22); --line-2: #D4D7D4;
  --accent: #E4572E; --on-accent: #FFFFFF; --err: #B03A18;
  --reply: #2B2E33; --ink-2: #2B2E33;
  --f-disp: "Bricolage Grotesque", "Arial", sans-serif; --f-body: "DM Sans", system-ui, sans-serif;
  --r: 4px; --w-step: 85ms; --w-dur: 520ms;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 var(--f-body); transition: background-color .25s var(--ease), color .25s var(--ease); }
body { min-height: 100dvh; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ---------- Structure : une grille, des zones nommées ---------- */
main {
  width: 100%; max-width: 520px; min-height: 100dvh; padding: 22px 22px 18px;
  display: grid; gap: 14px 16px; align-content: start;
  grid-template-columns: 1fr auto; grid-template-rows: auto auto auto auto 1fr auto auto auto auto;
  grid-template-areas: "top top" "settings settings" "status status" "slab slab" "reply reply" "log log" "gauges gauges" "values values" "form form";
}
.top { grid-area: top; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.top h1 { font: 700 30px/1 var(--f-disp); letter-spacing: .1em; display: flex; align-items: center; gap: 10px; }
.gear { font-size: 18px; color: var(--soft); width: 36px; height: 36px; margin: -6px 0; border-radius: var(--r); }
.gear:hover { color: var(--text); }
.linkline { font: 500 13px var(--f-body); color: var(--soft); display: flex; align-items: center; gap: 8px; }
.state-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
body[data-state="listening"] .state-dot, body[data-state="speaking"] .state-dot { background: var(--accent); }
body[data-state="thinking"] .state-dot { background: var(--soft); animation: blink 1s steps(2) infinite; }
body[data-state="recording"] .state-dot { background: var(--err); box-shadow: 0 0 0 4px color-mix(in srgb, var(--err) 25%, transparent); }
@keyframes blink { 50% { opacity: .25; } }

#status { grid-area: status; font: 500 14px var(--f-body); color: var(--soft); min-height: 1.4em; }
#status.err { color: var(--err); }

/* ---------- Scène : le slab + la réponse ---------- */
#slab { grid-area: slab; justify-self: center; display: flex; gap: 8px; align-items: flex-end; height: 150px; padding: 0 4px 12px; position: relative; flex: none; }
#slab i { display: block; width: 40px; height: 100%; transition: transform .45s var(--ease), height .45s var(--ease); }
#slab::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--line-2); transition: background .2s; }
body[data-state="listening"] #slab::after, body[data-state="speaking"] #slab::after { background: var(--accent); }
body[data-state="recording"] #slab::after { background: var(--err); animation: blink .8s steps(2) infinite; }
body[data-state="listening"] #slab { gap: 16px; }
body[data-state="thinking"] #slab i:nth-child(odd) { animation: stepUp 1.1s steps(3) infinite; }
body[data-state="thinking"] #slab i:nth-child(even) { animation: stepUp 1.1s steps(3) infinite reverse; }
body[data-state="speaking"] #slab i { animation: talk .9s var(--ease) infinite alternate; transform-origin: bottom; }
body[data-state="speaking"] #slab i:nth-child(2) { animation-delay: .15s; } body[data-state="speaking"] #slab i:nth-child(3) { animation-delay: .3s; } body[data-state="speaking"] #slab i:nth-child(4) { animation-delay: .45s; }
@keyframes stepUp { 0% { transform: translateY(0); } 100% { transform: translateY(-14px); } }
@keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(.84); } }

.reply { grid-area: reply; display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: center; min-height: 140px; }
#you { font: 500 14px var(--f-body); color: var(--soft); min-height: 1.4em; }
#you:not(:empty)::before { content: "Vous · "; }
#tars { font: 600 30px/1.14 var(--f-disp); color: var(--reply); letter-spacing: .005em; overflow-wrap: anywhere; transition: font-size .25s var(--ease); }
#tars[data-size="xl"] { font-size: clamp(38px, 11vw, 58px); } #tars[data-size="l"] { font-size: clamp(30px, 8.5vw, 44px); } #tars[data-size="m"] { font-size: clamp(24px, 6.5vw, 32px); }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .12em; margin-bottom: -.12em; }
.wi { display: inline-block; animation: var(--w-anim, wRise) var(--w-dur) var(--ease) both; animation-delay: calc(var(--i, 0) * var(--w-step)); }
.sp { display: inline-block; width: .28em; }

/* ---------- Journal (la conversation complète, repliée) ---------- */
#log { grid-area: log; border-top: 1px solid var(--line); padding-top: 8px; }
#log summary { cursor: pointer; font: 500 13px var(--f-body); color: var(--soft); list-style: none; padding: 6px 0; }
#log summary::-webkit-details-marker { display: none; }
#log summary::after { content: " +"; } #log[open] summary::after { content: " –"; }
#history { max-height: 30dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 6px 0 4px; font-size: 14px; }
#history p { color: var(--soft); } #history p.tars { color: var(--text); } #history strong { font-weight: 600; }

/* ---------- Jauges, saisie ---------- */
.gauges { grid-area: gauges; display: grid; gap: 8px; }
.gauge-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 12px; font: 500 13px var(--f-body); color: var(--soft); }
.bar { display: flex; gap: 4px; height: 6px; }
.bar b { flex: 1; background: var(--line); } .bar b.on { background: var(--ink-2); }
#g-honnetete b.on { background: var(--accent); }
.values-line { grid-area: values; font: 500 12px var(--f-body); color: var(--soft); display: none; }
html[data-design="editorial"] .values-line { display: block; }
#form { grid-area: form; display: flex; gap: 10px; align-items: stretch; padding-top: 4px; }
#txt { flex: 1; min-width: 0; padding: 12px 2px; background: transparent; border: 0; border-bottom: 2px solid var(--line-2); border-radius: 0; }
#txt::placeholder { color: var(--soft); opacity: .85; }
#txt:focus { outline: none; border-bottom-color: var(--accent); }
.send { padding: 0 20px; min-height: 44px; font: 700 14px var(--f-disp); letter-spacing: .08em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); border-radius: var(--r); }
.send:hover { filter: brightness(1.06); }

/* ---------- Réglages ---------- */
#settings { display: none; flex-direction: column; gap: 14px; padding: 18px 22px 24px; background: var(--bg); position: fixed; z-index: 20; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; height: 100dvh; overflow-y: auto; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
.settings-head { display: flex; align-items: center; justify-content: space-between; } .settings-head h2 { font: 700 22px var(--f-disp); letter-spacing: .08em; }
#settings.open { display: flex; }
.settings-row { display: grid; gap: 4px; }
.settings-row label, .settings-label { font: 600 12px var(--f-body); color: var(--soft); letter-spacing: .06em; text-transform: uppercase; }
#settings input[type="password"], #settings input[type="text"], #settings select { width: 100%; padding: 10px 10px; background: transparent; border: 1px solid var(--line-2); border-radius: var(--r); }
#settings input[type="range"] { width: 100%; accent-color: var(--accent); }
.range-row { display: grid; grid-template-columns: 72px 1fr 40px; align-items: center; gap: 10px; font: 500 13px var(--f-body); color: var(--soft); }
.settings-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.settings-status { flex: 1; font: 500 13px var(--f-body); color: var(--soft); min-width: 120px; } .settings-status.ok { color: var(--text); }
.clear, .ghost { padding: 0 14px; min-height: 40px; font: 600 13px var(--f-body); border: 1px solid var(--line-2); border-radius: var(--r); }
.design-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.design-card { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 8px; text-align: left; border: 1px solid var(--line-2); border-radius: var(--r); }
.design-card[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.design-name { font: 700 14px var(--f-disp); } .design-words { font: 400 11px/1.3 var(--f-body); color: var(--soft); }
.design-check { position: absolute; top: 4px; right: 6px; font-size: 12px; color: var(--accent); opacity: 0; } .design-card[aria-checked="true"] .design-check { opacity: 1; }
.design-status { min-height: 1.2em; font: 500 12px var(--f-body); color: var(--soft); } .design-status.err { color: var(--err); }
.design-preview { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 54px; padding: 6px; overflow: hidden; position: relative; }
.dp-monolithe { background: #E7E8E6; border-radius: 2px; } .dp-monolithe .dp-slab { width: 9px; height: 100%; background: linear-gradient(90deg,#B4B8BC,#E2E4E6 45%,#A9ADB2); border-radius: 1px; }
.dp-monolithe .dp-slab:nth-child(even) { height: 82%; } .dp-led { position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: #E39B2D; }
.dp-editorial { background: #F2F3F0; flex-direction: row; align-items: center; justify-content: space-between; } .dp-recu { font: 800 17px var(--f-disp); color: #2B2E33; font-family: "Bricolage Grotesque", sans-serif; }
.dp-bars { display: flex; gap: 2px; align-items: flex-end; height: 22px; } .dp-bars i { width: 3px; background: #2B2E33; } .dp-bars i:nth-child(1){height:9px} .dp-bars i:nth-child(2){height:20px} .dp-bars i:nth-child(3){height:13px} .dp-bars i:nth-child(4){height:18px;background:#E4572E}

/* ==========================================================
   1 · MONOLITHE — alu mat, quatre dalles, pas de cartes
   ========================================================== */
html[data-design="monolithe"] .top h1 { font-size: 32px; }
html[data-design="monolithe"] #slab i { border-radius: 2px; box-shadow: inset 0 0 0 1px #9A9EA2, 0 8px 14px -12px rgba(20,23,26,.38); background: linear-gradient(90deg,#B8BCBF,#DEE0E2 45%,#AFB3B6 100%); }
html[data-design="monolithe"] #slab i:nth-child(even) { height: 90%; }
html[data-design="monolithe"] .reply { border-left: 2px solid #3A3F45; padding-left: 14px; }
html[data-design="monolithe"] { --w-anim: wSlab; }
@keyframes wSlab { 0% { clip-path: inset(0 100% 0 0); transform: translateX(-10px); } 100% { clip-path: inset(0 0 0 0); transform: none; } }
html[data-design="monolithe"] .wi { animation-timing-function: steps(4, end); }
html[data-design="monolithe"] .send { background: #3A3F45; color: #fff; }

/* ==========================================================
   3 · ÉDITORIAL — la réponse est le design
   ========================================================== */
html[data-design="editorial"] main { grid-template-rows: auto auto auto 1fr auto auto auto auto; grid-template-areas: "top slab" "settings settings" "status status" "reply reply" "log log" "gauges gauges" "values values" "form form"; }
html[data-design="editorial"] .top { border-bottom: 0; padding-bottom: 0; } html[data-design="editorial"] .top h1 { font-weight: 800; letter-spacing: -.01em; font-size: 24px; }
html[data-design="editorial"] .linkline { display: none; }
html[data-design="editorial"] #slab { justify-self: end; height: 40px; width: 52px; padding: 0; gap: 4px; align-self: start; margin-top: -2px; }
html[data-design="editorial"] #slab { position: relative; }
html[data-design="editorial"] #slab i { width: 8px; background: var(--ink-2); border-radius: 1px; align-self: flex-end; }
html[data-design="editorial"] #slab i:nth-child(1) { height: 45%; } html[data-design="editorial"] #slab i:nth-child(2) { height: 100%; } html[data-design="editorial"] #slab i:nth-child(3) { height: 65%; } html[data-design="editorial"] #slab i:nth-child(4) { height: 85%; background: var(--accent); }
html[data-design="editorial"] #slab::after { display: none; }
html[data-design="editorial"] #slab { min-width: 44px; min-height: 44px; align-items: flex-end; justify-content: flex-end; }
html[data-design="editorial"] .reply { justify-content: flex-end; }
html[data-design="editorial"] #you { border-top: 2px solid var(--ink-2); padding-top: 12px; }
html[data-design="editorial"] #tars { font-weight: 800; letter-spacing: -.025em; line-height: 1.02; }
html[data-design="editorial"] { --w-anim: wMask; }
@keyframes wMask { 0% { transform: translateY(108%) rotate(2.5deg); } 70% { transform: translateY(-4%) rotate(0); } 100% { transform: none; } }
html[data-design="editorial"] #txt { border-bottom-color: var(--ink-2); }
html[data-design="editorial"] .send { background: transparent; color: var(--accent); padding: 0 4px; font-family: var(--f-body); }
html[data-design="editorial"] .gauges { display: none; }

/* ---------- État vide : pas de fausse barre de réponse ---------- */
.reply:has(#you:empty):has(#tars:empty) { border-left-width: 0; padding-left: 0; }
.reply:has(#you:empty):has(#tars:empty) #you { display: none; }

/* ---------- Mode widget (200×120) et embarqué ---------- */
body.widget-mode { width: 200px; height: 120px; min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
body.widget-mode main { padding: 8px; gap: 4px; min-height: 0; grid-template-areas: "status" "slab"; grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
body.widget-mode .top, body.widget-mode #settings, body.widget-mode #settings.open, body.widget-mode .reply, body.widget-mode #log, body.widget-mode .gauges, body.widget-mode #values, body.widget-mode #form { display: none !important; }
body.widget-mode #status { font-size: 11px; } body.widget-mode #slab { grid-area: slab; height: 44px; width: auto; padding: 0; gap: 4px; margin: 0 auto; border: 0 !important; }
body.widget-mode #slab i { width: 12px; height: 100% !important; border: 0 !important; background: var(--accent) !important; box-shadow: none !important; animation: none !important; transform: none !important; } body.widget-mode #slab::before, body.widget-mode #slab::after { display: none !important; }
body.widget-mode #slab { align-self: center; }
body.embedded main { padding: 14px; }

/* ---------- Sections repliables des réglages ---------- */
.settings-block { border-top: 1px solid var(--line); padding-top: 8px; }
.settings-block > summary { cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 0; list-style: none; font: 600 12px var(--f-body); color: var(--soft); letter-spacing: .06em; text-transform: uppercase; }
.settings-block > summary::-webkit-details-marker { display: none; }
.settings-block > summary::after { content: " +"; margin-left: auto; }
.settings-block[open] > summary::after { content: " –"; }
.settings-block > summary .count { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--soft); }
.block-body { display: grid; gap: 10px; padding-top: 6px; }
.settings-status.err { color: var(--err); }
#settings .toggle { display: flex; align-items: center; gap: 8px; font: 500 13px var(--f-body); color: var(--text); letter-spacing: 0; text-transform: none; }
#settings .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
#settings input[type="search"], #settings textarea { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--line-2); border-radius: var(--r); font: 500 13px/1.4 var(--f-body); resize: vertical; }
.memory-form { display: flex; gap: 8px; align-items: stretch; }
.memory-form input { flex: 1; min-width: 0; }
.mem-list { display: grid; gap: 8px; max-height: 300px; overflow-y: auto; }
.mem-empty, .hist-empty { font: 500 13px var(--f-body); color: var(--soft); }
.mem-item { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); }
.mem-text { font: 500 13px/1.4 var(--f-body); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mem-meta { display: flex; justify-content: space-between; gap: 8px; font: 500 11px var(--f-body); color: var(--soft); }
.mem-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mem-actions .ghost { min-height: 32px; padding: 0 10px; font-size: 12px; }
.hist-list { display: grid; gap: 6px; max-height: 320px; overflow-y: auto; }
.hist-item { display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); }
.hist-item.current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.hist-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.hist-title { font: 600 13px var(--f-body); overflow-wrap: anywhere; }
.hist-badge { font: 600 10px var(--f-body); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.hist-meta { font: 500 11px var(--f-body); color: var(--soft); }
.hist-preview { font: 500 12px/1.35 var(--f-body); color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hist-open { justify-self: start; min-height: 30px; padding: 0 10px; font-size: 12px; }
.diag-list { display: grid; gap: 4px; font: 500 12px/1.45 var(--f-body); }
.diag-line { display: grid; grid-template-columns: 108px 1fr; gap: 8px; }
.diag-line .diag-key { color: var(--soft); }
.diag-line .diag-val { overflow-wrap: anywhere; }
.diag-line .diag-val.bad { color: var(--err); }

::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; animation-delay: 0s !important; }
}
@media (max-height: 640px) { #slab { height: 100px; } .reply { min-height: 100px; } }
</style>
</head>
<body data-state="off">
<main>
  <header class="top">
    <h1>TARS <button id="gear" class="gear" type="button" aria-label="Réglages" title="Réglages">⚙</button></h1>
    <p class="linkline"><span class="state-dot"></span><span class="state-text">Liaison active</span></p>
  </header>

  <section id="settings" aria-label="Réglages">
    <div class="settings-head"><h2>Réglages</h2><button id="settings-close" class="ghost" type="button">Fermer</button></div>
    <div class="settings-row">
      <label for="groq-key">Clé Groq</label>
      <input type="password" id="groq-key" placeholder="gsk_..." autocomplete="off" spellcheck="false">
    </div>
    <div class="settings-row">
      <label for="groq-model">Modèle</label>
      <input type="text" id="groq-model" value="openai/gpt-oss-120b" autocomplete="off" spellcheck="false">
    </div>
    <section class="settings-design" aria-labelledby="design-label">
      <p class="settings-label" id="design-label">Design</p>
      <div class="design-grid" role="radiogroup" aria-labelledby="design-label">
        <button type="button" class="design-card" role="radio" aria-checked="true" data-choice="monolithe" aria-label="Monolithe. Mat, articulé, sec.">
          <span class="design-preview dp-monolithe" aria-hidden="true"><span class="dp-slab"></span><span class="dp-slab"></span><span class="dp-slab"></span><span class="dp-slab"></span><span class="dp-led"></span></span>
          <span class="design-name">Monolithe</span><span class="design-words">Mat · articulé · sec</span><span class="design-check" aria-hidden="true">✓</span>
        </button>
        <button type="button" class="design-card" role="radio" aria-checked="false" data-choice="editorial" aria-label="Éditorial. Parlé, typographique, léger.">
          <span class="design-preview dp-editorial" aria-hidden="true"><span class="dp-recu">Reçu.</span><span class="dp-bars"><i></i><i></i><i></i><i></i></span></span>
          <span class="design-name">Éditorial</span><span class="design-words">Parlé · typographique · léger</span><span class="design-check" aria-hidden="true">✓</span>
        </button>
      </div>
      <p id="design-status" class="design-status" role="status" aria-live="polite"></p>
    </section>
    <section class="settings-voice" aria-labelledby="voice-label">
      <p class="settings-label" id="voice-label">Voix</p>
      <div class="settings-row"><select id="voice-preset" aria-label="Préréglage de voix"><option value="tars">TARS — grave, lente, sans émotion</option><option value="calm">Posée</option><option value="natural">Naturelle</option></select></div>
      <div class="settings-row"><select id="voice-pick" aria-label="Voix du système"></select></div>
      <div class="range-row"><label for="voice-pitch">Hauteur</label><input type="range" id="voice-pitch" min="0" max="1.2" step="0.05"><output id="voice-pitch-v"></output></div>
      <div class="range-row"><label for="voice-rate">Débit</label><input type="range" id="voice-rate" min="0.6" max="1.3" step="0.05"><output id="voice-rate-v"></output></div>
      <div class="settings-row">

<script>
"use strict";
const $ = s => document.querySelector(s);
const BACKEND_URL = `http://localhost:${new URLSearchParams(window.location.search).get('port') || 8000}`;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const NATIVE_TTS = !!(window.NativeTTS && typeof window.NativeTTS.speak === "function");
// Dans l'APK, la WebView expose SpeechRecognition mais il ne fournit pas de résultat fiable :
// on utilise toujours MediaRecorder + /stt (Groq Whisper), avec arrêt automatique sur silence.
const USE_SR = !!SR && !NATIVE_TTS;
const HAS_TTS = typeof window.speechSynthesis !== "undefined" && window.speechSynthesis;

let state = "off", session = false, rec = null, ctrl = null, wake = null;
let gen = 0, pending = 0, streaming = false, gotFirst = false, ackTimer = null, lastAck = "";
let sttCtrl = null;
let settings = { humour: 60, honnetete: 90 };
let voice = null;
let mediaStream = null, recorder = null, chunks = [];
let monitor = null, monitorStream = null, monitorAt = 0, monitorVad = null, monitorCtx = null, monitorBuf = null;
let monitorStarting = false;
let ttsSeq = 0, ttsIds = new Set();
let audioCtx = null, analyser = null, vadTimer = null, vadBuf = null;
let speechSeen = false, lastVoiceAt = 0, recStartedAt = 0, noiseFloor = null;
let recPending = false, srText = "", srFinalTimer = null;
let isWidget = new URLSearchParams(location.search).has("widget");

/* ---------- État conversation / historique ---------- */
let conversation = [];
let currentSessionId = "";
let pendingTurn = null;
let historySessions = [];
let historyRefreshTimer = null;
let memoryFacts = [];
let memoryEditingId = null;
let memoryLoading = false;
let memoryReloadPending = false;

/* ---------- Piper ---------- */
let piperPref = null;
let piperEnabled = false;
let piperAvailable = null;
let piperBroken = false;
let piperQueue = [];
let piperPlaying = false;
let piperSeq = 0;
let piperAudio = null;
let piperTestAudio = null;
const piperControllers = new Set();
const piperCache = new Map();
const PIPER_CACHE_MAX = 60;
try {
  const stored = localStorage.getItem("tars.piper");
  if (stored === "1" || stored === "0") {
    piperPref = stored === "1";
    piperEnabled = piperPref;
  }
} catch (e) {}


// Détecter si on est en mode embarqué
const isEmbedded = (
  typeof window.electronAPI !== 'undefined' ||
  (window.Capacitor && window.Capacitor.getPlatform() !== 'web')
);
if (isEmbedded) {
  document.body.classList.add('embedded');
}

// Base des appels API (même origine en web et dans Electron, backend local sinon)
const apiBase = () => (location.protocol === "http:" || location.protocol === "https:")
  ? location.origin
  : BACKEND_URL;

// Activer le mode widget si demandé
if (isWidget) {
  document.body.classList.add("widget-mode");
}

/* ---------- Affichage ---------- */
const LABELS = {
  off: "Appuyez sur TARS, commandant.",
  listening: "Je vous écoute, commandant.",
  thinking: "Réflexion en cours...",
  speaking: "",
  recording: "J'enregistre…"
};

function setState(s) {
  state = s;
  document.body.dataset.state = s;
  if (LABELS[s] !== undefined) note(LABELS[s]);
}

function note(msg, err) {
  const el = $("#status");
  el.textContent = msg;
  el.classList.toggle("err", !!err);
}

function renderGauges() {
  for (const k of ["humour", "honnetete"]) {
    const n = Math.round(settings[k] / 100 * 6), el = $("#g-" + k);
    el.setAttribute("title", settings[k] + " %");
    el.innerHTML = Array.from({ length: 6 }, (_, i) => `<b class="${i < n ? "on" : ""}"></b>`).join("");
  }
  const values = $("#values");
  if (values) values.textContent = `Humour ${settings.humour} · Honnêteté ${settings.honnetete}`;
}

/* ---------- Design ---------- */
const DESIGNS = ["monolithe", "editorial"];
const THEME_COLORS = {
  monolithe: "#E7E8E6",
  editorial: "#F2F3F0",
};
let currentDesign = "monolithe";
let designTouched = false;
let designQueue = Promise.resolve();
let designSeq = 0;
let desiredDesign = currentDesign;
let savedDesign = currentDesign;

function setDesignStatus(message, isError) {
  const el = $("#design-status");
  if (!el) return;
  el.textContent = message || "";
  el.classList.toggle("err", !!isError);
}

function applyDesign(name, options = {}) {
  if (!DESIGNS.includes(name)) name = "monolithe";
  currentDesign = name;
  document.documentElement.dataset.design = name;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", THEME_COLORS[name]);
  document.querySelectorAll(".design-card").forEach(card => {
    const selected = card.dataset.choice === name;
    card.setAttribute("aria-checked", selected ? "true" : "false");
    card.tabIndex = selected ? 0 : -1;
  });
  if (options.status !== undefined) setDesignStatus(options.status, options.error);
  return name;
}

async function saveDesign(name, seq) {
  try {
    const response = await fetch(`${apiBase()}/design`, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ design: name }),
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || ("HTTP " + response.status));
    savedDesign = name;
    if (desiredDesign === name && seq === designSeq) setDesignStatus("Enregistré");
  } catch (error) {
    if (desiredDesign !== name || seq !== designSeq) return;
    applyDesign(savedDesign);
    setDesignStatus("Erreur : design non enregistré", true);
  }
}

function chooseDesign(name) {
  if (!DESIGNS.includes(name) || name === currentDesign) return;
  designTouched = true;
  desiredDesign = name;
  const seq = ++designSeq;
  applyDesign(name, { status: "Enregistrement…" });
  designQueue = designQueue.then(() => {
    if (desiredDesign !== name || seq !== designSeq) return;
    return saveDesign(name, seq);
  }).catch(() => {});
}

const designCards = Array.from(document.querySelectorAll(".design-card"));

function focusDesignCard(index) {
  const card = designCards[(index + designCards.length) % designCards.length];
  card.focus();
  chooseDesign(card.dataset.choice);
}

designCards.forEach((card, index) => {
  card.addEventListener("click", () => chooseDesign(card.dataset.choice));
  card.addEventListener("keydown", event => {
    let target = null;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") target = index + 1;
    else if (event.key === "ArrowLeft" || event.key === "ArrowUp") target = index - 1;
    else if (event.key === "Home") target = 0;
    else if (event.key === "End") target = designCards.length - 1;
    if (target === null) return;
    event.preventDefault();
    focusDesignCard(target);
  });
});

applyDesign(DESIGNS.includes(document.documentElement.dataset.design) ? document.documentElement.dataset.design : "monolithe");
savedDesign = currentDesign;
desiredDesign = currentDesign;

/* ---------- Réponse : arrivée mot à mot ---------- */
function clearReply() {
  const el = $("#tars");
  el.textContent = "";
  el.dataset.size = "xl";
}

function appendReply(sentence) {
  const el = $("#tars");
  const words = String(sentence || "").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return;
  if (el.childNodes.length) el.appendChild(document.createTextNode(" "));
  words.forEach((word, i) => {
    const outer = document.createElement("span");
    outer.className = "w";
    const inner = document.createElement("span");
    inner.className = "wi";
    inner.style.setProperty("--i", i);
    inner.textContent = word;
    outer.appendChild(inner);
    el.appendChild(outer);
    if (i < words.length - 1) el.appendChild(document.createTextNode(" "));
  });
  const n = el.textContent.length;
  el.dataset.size = n <= 45 ? "xl" : n <= 110 ? "l" : "m";
}

/* ---------- Historique / conversation ---------- */
function journalMessage(role, text) {
  const para = document.createElement("p");
  para.className = role === "assistant" ? "tars" : "user";
  const strong = document.createElement("strong");
  strong.textContent = role === "assistant" ? "TARS:" : "Toi:";
  const body = document.createElement("span");
  body.className = "jtext";
  body.textContent = text || "";
  para.appendChild(strong);
  para.appendChild(document.createTextNode(" "));
  para.appendChild(body);
  return para;
}

function scrollJournal() {
  const historyDiv = $("#history");
  historyDiv.scrollTop = historyDiv.scrollHeight;
}

function renderJournal() {
  const historyDiv = $("#history");
  historyDiv.textContent = "";
  for (const message of conversation) {
    historyDiv.appendChild(journalMessage(message.role, message.content));
  }
  scrollJournal();
  let lastUser = "", lastTars = "";
  for (const message of conversation) {
    if (message.role === "user") lastUser = message.content;
    else if (message.role === "assistant") lastTars = message.content;
  }
  $("#you").textContent = lastUser;
  $("#tars").textContent = lastTars;
  $("#tars").dataset.size = lastTars.length <= 45 ? "xl" : lastTars.length <= 110 ? "l" : "m";
}

function removeLastJournalAssistant() {
  const nodes = $("#history").children;
  for (let i = nodes.length - 1; i >= 0; i--) {
    if (nodes[i].classList && nodes[i].classList.contains("tars")) {
      nodes[i].remove();
      return;
    }
  }
}

function startPendingTurn(mode, userText) {
  pendingTurn = {
    mode, userText, assistant: "", tarsEl: null, userIndex: -1,
    previousAssistant: null, previousRemoved: false, failed: false, settled: false,
  };
  return pendingTurn;
}

function ensurePendingAssistant(turn) {
  if (turn.tarsEl) return turn.tarsEl;
  turn.tarsEl = journalMessage("assistant", "");
  $("#history").appendChild(turn.tarsEl);
  return turn.tarsEl;
}

function setPendingAssistantText(turn, text) {
  const el = ensurePendingAssistant(turn);
  const body = el.querySelector(".jtext");
  if (body) body.textContent = text;
}

function commitPendingTurn(turn) {
  if (!turn || turn.settled) return;
  turn.settled = true;
  const text = turn.assistant.trim();
  if (text) conversation.push({ role: "assistant", content: text });
  if (pendingTurn === turn) pendingTurn = null;
  scheduleHistoryRefresh();
}

function discardPendingTurn(turn) {
  if (!turn || turn.settled) return;
  turn.settled = true;
  if (turn.mode === "send" && turn.userIndex >= 0) {
    const current = conversation[turn.userIndex];
    if (current && current.role === "user" && current.content === turn.userText) {
      conversation.splice(turn.userIndex, 1);
    }
  }
  if (turn.mode === "regenerate" && turn.previousRemoved && turn.previousAssistant) {
    conversation.push(turn.previousAssistant);
  }
  if (pendingTurn === turn) pendingTurn = null;
  renderJournal();
}

function scheduleHistoryRefresh() {
  clearTimeout(historyRefreshTimer);
  historyRefreshTimer = setTimeout(() => { loadHistory({ silent: true }); }, 500);
}

function formatDate(value) {
  const n = Number(value);
  if (!Number.isFinite(n) || n <= 0) return "—";
  const ms = n > 1e12 ? n : n * 1000;
  const date = new Date(ms);
  if (!Number.isFinite(date.getTime())) return "—";
  try { return date.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }); }
  catch (e) { return date.toLocaleString(); }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 2000);
}


/* ---------- Synthèse vocale ---------- */
const ACK_AUDIO = {
  court: [],
  reflexion: [],
  drole: []
};

function loadAudioClips() {
  const dummyClips = {
    court: ["recu", "mmh", "compris", "bien_recu", "ok"],
    reflexion: ["hm_voyons", "une_seconde", "je_reflechis", "laissez_moi_verifier", "attendez"],
    drole: ["recu_je_fais_semblant_d_etre_surpris", "mmh_passionnant", "compris_evidemment", "bien_recu_enfin", "ok_si_vous_le_dites"]
  };
  for (const [category, clips] of Object.entries(dummyClips)) {
    clips.forEach(clip => {
      const audio = new Audio(`${apiBase()}/static/acks/${category}/${clip}.mp3`);
      audio.preload = "auto";
      let triedWav = false;
      audio.onerror = () => {
        if (!triedWav && !audio.src.endsWith(".wav")) {
          triedWav = true;
          audio.src = audio.src.replace(/\.mp3$/, ".wav");
        } else {
          console.warn(`Clip audio non trouvé: ${category}/${clip}`);
        }
      };
      ACK_AUDIO[category].push(audio);
    });
  }
}

function pickAck(text) {
  const long = text.length > 80 || /expliqu|pourquoi|comment|compar/i.test(text);
  let pool = long ? ACK_AUDIO.reflexion : ACK_AUDIO.court;
  if (settings.humour >= 70) pool = pool.concat(ACK_AUDIO.drole);
  if (settings.humour <= 30) pool = ACK_AUDIO.court.slice(0, 2);

  const available = pool.filter(a => a.src !== lastAck);
  if (available.length === 0) return pool[0];

  const clip = available[Math.floor(Math.random() * available.length)];
  lastAck = clip.src;
  return clip;
}

function pickVoice() {
  if (!HAS_TTS) return;
  const vs = window.speechSynthesis.getVoices();
  populateVoices(vs);
  voice = (voicePrefs.name && vs.find(v => v.name === voicePrefs.name)) ||
          vs.find(v => /^fr.*Male/i.test(v.name)) ||
          vs.find(v => /Google fr-FR Standard A/i.test(v.name)) ||
          vs.find(v => /Microsoft.*French.*Male/i.test(v.name)) ||
          vs.find(v => /^fr[-_]FR/i.test(v.lang)) ||
          vs.find(v => /^fr/i.test(v.lang)) || null;
}


/* ---------- Voix TARS ---------- */
const VOICE_PRESETS = {
  tars:    { pitch: 0.2,  rate: 0.9 },
  calm:    { pitch: 0.6,  rate: 0.95 },
  natural: { pitch: 1.0,  rate: 1.0 },
};
let voicePrefs = { preset: "tars", pitch: 0.2, rate: 0.9, name: "" };
try {
  const raw = JSON.parse(localStorage.getItem("tars.voice") || "null");
  if (raw && typeof raw === "object") {
    voicePrefs = {
      preset: VOICE_PRESETS[raw.preset] ? raw.preset : "custom",
      pitch: Math.min(1.2, Math.max(0, Number(raw.pitch))) || 0.2,
      rate: Math.min(1.3, Math.max(0.6, Number(raw.rate))) || 0.9,
      name: typeof raw.name === "string" ? raw.name : "",
    };
  }
} catch (e) {}

function saveVoicePrefs() {
  try { localStorage.setItem("tars.voice", JSON.stringify(voicePrefs)); } catch (e) {}
}
function voiceParams() { return { pitch: voicePrefs.pitch, rate: voicePrefs.rate }; }

// TARS parle sec : pas de point d'exclamation, pas d'emoji, pas de markdown.
function deadpan(text) {
  return String(text)
    .replace(/\p{Extended_Pictographic}/gu, "")
    .replace(/[*_`#>]+/g, "")
    .replace(/!+/g, ".")
    .replace(/\.{2,}|…/g, ".")
    .replace(/\s+/g, " ")
    .trim();
}

function populateVoices(vs) {
  const sel = $("#voice-pick");
  if (!sel) return;
  const fr = vs.filter(v => /^fr/i.test(v.lang));
  const list = fr.length ? fr : vs;
  sel.innerHTML = '<option value="">Voix automatique</option>' +
    list.map(v => `<option value="${v.name.replace(/"/g, "&quot;")}">${v.name}</option>`).join("");
  sel.value = list.some(v => v.name === voicePrefs.name) ? voicePrefs.name : "";
}

function syncVoiceUI() {
  const set = (id, v) => { const el = $(id); if (el) el.value = v; };
  set("#voice-preset", VOICE_PRESETS[voicePrefs.preset] ? voicePrefs.preset : "tars");
  set("#voice-pitch", voicePrefs.pitch);
  set("#voice-rate", voicePrefs.rate);
  $("#voice-pitch-v").textContent = voicePrefs.pitch.toFixed(2);
  $("#voice-rate-v").textContent = voicePrefs.rate.toFixed(2);
}

function systemSpeakTest(text) {
  const vp = voiceParams();
  if (HAS_TTS) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    if (voice) u.voice = voice;
    u.pitch = vp.pitch; u.rate = vp.rate;
    window.speechSynthesis.speak(u);
  } else if (window.NativeTTS && typeof window.NativeTTS.speak === "function") {
    if (typeof window.NativeTTS.setVoice === "function") window.NativeTTS.setVoice(vp.pitch, vp.rate);
    window.NativeTTS.speak(text, "test-" + Date.now());
  }
}

function speakTest() {
  const text = "Honnêteté, quatre-vingt-dix pour cent. Je vous écoute, commandant.";
  if (streaming || pendingTurn) {
    setPiperStatus("Test indisponible pendant la réponse", true);
    return;
  }
  stopPiper();
  pending = 0;
  if (HAS_TTS && window.speechSynthesis) window.speechSynthesis.cancel();
  if (window.NativeTTS && typeof window.NativeTTS.stop === "function") {
    try { window.NativeTTS.stop(); } catch (e) {}
  }
  if (piperEnabled) {
    piperBroken = false;
    testPiper(text).then(ok => { if (!ok) systemSpeakTest(text); });
    return;
  }
  systemSpeakTest(text);
}

if (HAS_TTS) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

/* ---------- Piper : synthèse locale, cache et repli ---------- */
function setPiperStatus(message, isError) {
  const el = $("#piper-status");
  if (!el) return;
  el.textContent = message;
  el.classList.toggle("err", !!isError);
  el.classList.toggle("ok", !isError && message.indexOf("indisponible") === -1 && /disponible|OK/i.test(message));
}

function setPiperAvailability(available) {
  piperAvailable = typeof available === "boolean" ? available : null;
  if (piperAvailable === true && piperPref === null && !piperEnabled) {
    piperEnabled = true;
    const box = $("#piper-enabled");
    if (box) box.checked = true;
  }
  if (piperBroken) setPiperStatus("Piper indisponible — voix système", true);
  else if (piperAvailable === true) setPiperStatus("Piper : disponible");
  else if (piperAvailable === false) setPiperStatus(piperEnabled ? "Piper : indisponible (repli système)" : "Piper : indisponible", piperEnabled);
  else setPiperStatus("Piper : inconnu");
}

function piperCachePut(text, url) {
  if (piperCache.size >= PIPER_CACHE_MAX) {
    const oldest = piperCache.keys().next().value;
    const oldUrl = piperCache.get(oldest);
    piperCache.delete(oldest);
    if (oldUrl) { try { URL.revokeObjectURL(oldUrl); } catch (e) {} }
  }
  piperCache.set(text, url);
}

async function fetchPiperAudio(text, signal) {
  const cached = piperCache.get(text);
  if (cached) return cached;
  const response = await fetch(`${apiBase()}/tts`, {
    method: "POST",
    credentials: "same-origin",
    signal,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  if (!response.ok) {
    let message = "HTTP " + response.status;
    try {
      const data = await response.json();
      if (data && data.error) message = data.error;
    } catch (e) {}
    throw new Error(message);
  }
  const blob = await response.blob();
  if (!blob || !blob.size) throw new Error("audio vide");
  const url = URL.createObjectURL(blob);
  piperCachePut(text, url);
  return url;
}

function playPiperUrl(url, seq, test) {
  return new Promise((resolve, reject) => {
    if (seq !== piperSeq) { resolve(); return; }
    const audio = new Audio(url);
    if (test) piperTestAudio = audio;
    else piperAudio = audio;
    let finished = false;
    const finish = ok => {
      if (finished) return;
      finished = true;
      if (test) { if (piperTestAudio === audio) piperTestAudio = null; }
      else if (piperAudio === audio) piperAudio = null;
      if (ok) resolve();
      else reject(new Error("lecture audio impossible"));
    };
    audio.onended = () => finish(true);
    audio.onerror = () => finish(false);
    const playback = audio.play();
    if (playback && typeof playback.then === "function") {
      playback.catch(() => { try { audio.pause(); } catch (e) {} finish(false); });
    }
  });
}

function settlePiper(item) {
  if (!item || item.done) return;
  item.done = true;
  if (item.g !== gen) return;
  pending = Math.max(0, pending - 1);
  maybeResume();
}

function piperFlushToFallback(item) {
  if (!item || item.done) return;
  item.done = true;
  if (item.g !== gen) return;
  pending = Math.max(0, pending - 1);
  piperBroken = true;
  setPiperAvailability(piperAvailable === null ? false : piperAvailable);
  const rest = piperQueue.splice(0);
  fallbackTTS(item.text);
  for (const other of rest) {
    if (!other || other.done) continue;
    other.done = true;
    if (other.g !== gen) continue;
    pending = Math.max(0, pending - 1);
    fallbackTTS(other.text);
  }
}

async function piperPump() {
  if (piperPlaying) return;
  const item = piperQueue.shift();
  if (!item) return;
  if (item.done) { piperPump(); return; }
  if (item.g !== gen) { item.done = true; piperPump(); return; }
  piperPlaying = true;
  const seq = piperSeq;
  const controller = new AbortController();
  piperControllers.add(controller);
  try {
    const url = await fetchPiperAudio(item.text, controller.signal);
    if (seq !== piperSeq || item.done) return;
    await playPiperUrl(url, seq, false);
    if (seq !== piperSeq) return;
    settlePiper(item);
  } catch (error) {
    if (seq !== piperSeq || item.done) return;
    if (error && error.name === "AbortError") return;
    piperFlushToFallback(item);
  } finally {
    piperControllers.delete(controller);
    if (seq === piperSeq) {
      piperPlaying = false;
      piperPump();
    }
  }
}

function piperEnqueue(text) {
  if (!piperEnabled || piperBroken) { fallbackTTS(text); return; }
  piperQueue.push({ text, g: gen, done: false });
  pending++;
  piperPump();
}

function stopPiper() {
  piperSeq++;
  for (const controller of piperControllers) { try { controller.abort(); } catch (e) {} }
  piperControllers.clear();
  piperQueue.length = 0;
  if (piperAudio) { try { piperAudio.pause(); } catch (e) {} piperAudio = null; }
  if (piperTestAudio) { try { piperTestAudio.pause(); } catch (e) {} piperTestAudio = null; }
  piperPlaying = false;
}

async function testPiper(text) {
  if (!piperEnabled) return false;
  const seq = piperSeq;
  const controller = new AbortController();
  piperControllers.add(controller);
  try {
    const url = await fetchPiperAudio(text, controller.signal);
    if (seq !== piperSeq) return true;
    await playPiperUrl(url, seq, true);
    piperAvailable = true;
    piperBroken = false;
    setPiperStatus("Piper : disponible");
    return true;
  } catch (error) {
    if (seq !== piperSeq) return true;
    piperBroken = true;
    setPiperAvailability(false);
    return false;
  } finally {
    piperControllers.delete(controller);
  }
}

function say(text) {
  if (isWidget) return;
  const clean = deadpan(text);
  if (!clean) return;
  if (piperEnabled && !piperBroken && piperAvailable !== false) piperEnqueue(clean);
  else fallbackTTS(clean);
}

function playAck() {
  if (isWidget) return;
  const clip = pickAck('');
  if (clip) {
    clip.currentTime = 0;
    const p = clip.play();
    if (p !== undefined) p.catch(() => {});
  }
}

function fallbackTTS(text) {
  if (HAS_TTS) {
    const g = gen, u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    if (voice) u.voice = voice;
    const vp = voiceParams(); u.pitch = vp.pitch; u.rate = vp.rate;
    const done = () => {
      if (g !== gen) return;
      pending = Math.max(0, pending - 1);
      maybeResume();
    };
    u.onend = done;
    u.onerror = done;
    pending++;
    window.speechSynthesis.speak(u);
    return;
  }
  if (!window.NativeTTS || typeof window.NativeTTS.speak !== "function") return;
  const id = `tts-${++ttsSeq}`;
  ttsIds.add(id);
  window.onNativeTTSDone = doneId => {
    if (!ttsIds.has(doneId)) return;
    ttsIds.delete(doneId);
    pending = Math.max(0, pending - 1);
    maybeResume();
  };
  pending++;
  try {
    if (typeof window.NativeTTS.setVoice === "function") {
      const vp = voiceParams();
      window.NativeTTS.setVoice(vp.pitch, vp.rate);
    }
    window.NativeTTS.speak(text, id);
  } catch (e) {
    ttsIds.delete(id);
    pending = Math.max(0, pending - 1);
  }
}

/* ---------- Reconnaissance vocale ---------- */
function stopRec() {
  const r = rec;
  rec = null;
  if (r) { try { r.abort(); } catch (e) {} }
}

function wantsMic() {
  return session;
}

function listen() {
  if (!USE_SR || !session) return;
  clearTimeout(srFinalTimer);
  srText = "";
  stopRec();
  const me = new SR(); rec = me;
  me.lang = "fr-FR";
  me.interimResults = true;
  me.continuous = false;
  me.onresult = e => {
    if (rec !== me) return;
    let txt = "", fin = false;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      txt += e.results[i][0].transcript;
      if (e.results[i].isFinal) fin = true;
    }
    if (state !== "listening" && txt.trim().length > 2) interrupt(false);
    if (state === "listening") $("#you").textContent = txt;
    if (fin && state === "listening") {
      clearTimeout(srFinalTimer);
      srText = "";
      stopRec();
      send(txt.trim());
      return;
    }
    if (txt.trim()) {
      srText = txt;
      clearTimeout(srFinalTimer);
      srFinalTimer = setTimeout(() => {
        if (rec === me && state === "listening" && srText.trim()) {
          stopRec();
          send(srText.trim());
          srText = "";
        }
      }, 1600);
    }
  };
  me.onerror = e => {
    if (rec !== me) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      note("Micro refusé. Autorisez-le dans les réglages du site.", true);
      endSession();
    }
  };
  me.onend = () => {
    clearTimeout(srFinalTimer);
    if (rec === me && wantsMic()) setTimeout(() => { if (rec === me) listen(); }, 150);
  };
  try { me.start(); } catch (e) { /* déjà démarré */ }
}

/* ---------- Enregistrement micro (sans SpeechRecognition) ---------- */
function cleanupVad() {
  clearInterval(vadTimer);
  vadTimer = null;
  if (audioCtx) audioCtx.close().catch(() => {});
  audioCtx = null;
  analyser = null;
  vadBuf = null;
}

function stopStream() {
  cleanupVad();
  if (!mediaStream) return;
  mediaStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
  mediaStream = null;
}

/* ---------- Écoute de veille (interruption pendant la parole) ---------- */
function stopMonitor(keepStream) {
  clearInterval(monitorVad); monitorVad = null;
  if (monitorCtx) { try { monitorCtx.close(); } catch (e) {} monitorCtx = null; }
  monitorBuf = null;
  if (monitor) { try { monitor.ondataavailable = null; monitor.stop(); } catch (e) {} monitor = null; }
  if (!keepStream && monitorStream) {
    monitorStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    monitorStream = null;
  }
}

async function startBargeMonitor() {
  if (!session || USE_SR || monitor || monitorStarting || recorder || recPending) return;
  if (!navigator.mediaDevices || typeof MediaRecorder === "undefined") return;
  monitorStarting = true;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) { monitorStarting = false; return; }
  monitorStarting = false;
  if (!session || recorder || recPending) { stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); return; }
  monitorStream = stream;
  try { monitor = new MediaRecorder(stream); } catch (e) { stopMonitor(); return; }
  monitor.ondataavailable = () => {};
  try { monitor.start(); } catch (e) { stopMonitor(); return; }
  monitorAt = Date.now();
  startMonitorVad();
}

function startMonitorVad() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) { stopMonitor(); return; }
  let analyser;
  try {
    monitorCtx = new Ctx();
    if (monitorCtx.state === "suspended") monitorCtx.resume().catch(() => {});
    const src = monitorCtx.createMediaStreamSource(monitorStream);
    analyser = monitorCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.6;
    src.connect(analyser);
    monitorBuf = new Uint8Array(analyser.fftSize);
  } catch (e) { stopMonitor(); return; }
  let noise = null, frames = 0;
  monitorVad = setInterval(() => {
    if (!monitor || !monitorCtx || !monitorBuf) { stopMonitor(); return; }
    if (Date.now() - monitorAt > 20000) {
      if (state === "speaking" || state === "thinking") { monitorAt = Date.now(); }
      else { stopMonitor(); return; }
    }
    analyser.getByteTimeDomainData(monitorBuf);
    let sum = 0;
    for (let i = 0; i < monitorBuf.length; i++) { const d = (monitorBuf[i] - 128) / 128; sum += d * d; }
    const rms = Math.sqrt(sum / monitorBuf.length);
    if (noise === null && Date.now() - monitorAt < 400) noise = rms;
    const threshold = Math.max(0.02, Math.min(noise === null ? 0.05 : noise, 0.05) * 2.5);
    if (rms > threshold) frames++; else frames = 0;
    if (frames >= 2 && (state === "speaking" || state === "thinking")) {
      bargeIn();
      return;
    }
  }, 100);
}

function bargeIn() {
  const stream = monitorStream;
  stopMonitor(true);
  monitorStream = null;
  interrupt(false);
  if (stream) startRecording(stream, true);
}

function startVad(stream, assumeSpeech) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audioCtx = new Ctx();
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.6;
  src.connect(analyser);
  vadBuf = new Uint8Array(analyser.fftSize);
  speechSeen = !!assumeSpeech;
  lastVoiceAt = assumeSpeech ? Date.now() : 0;
  noiseFloor = 0.008;
  recStartedAt = Date.now();
  vadTimer = setInterval(() => {
    if (!recorder || !analyser) { cleanupVad(); return; }
    analyser.getByteTimeDomainData(vadBuf);
    let sum = 0;
    for (let i = 0; i < vadBuf.length; i++) { const d = (vadBuf[i] - 128) / 128; sum += d * d; }
    const rms = Math.sqrt(sum / vadBuf.length);
    const now = Date.now();
    const threshold = Math.max(0.012, (noiseFloor || 0) * 2.5);
    if (rms > threshold) { speechSeen = true; lastVoiceAt = now; }
    if (!speechSeen && now - recStartedAt > 8000) { cleanupVad(); stopRecording(true); setState("listening"); note("Rien entendu, commandant.", true); return; }
    if (speechSeen && now - lastVoiceAt > 1200) { cleanupVad(); stopRecording(); return; }
    if (now - recStartedAt > 15000) { cleanupVad(); stopRecording(); return; }
  }, 100);
}

async function startRecording(existingStream, assumeSpeech) {
  if (recPending) return;
  if (!session || recorder) return;
  if (!existingStream && (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function" ||
      typeof MediaRecorder === "undefined")) {
    setState("listening");
    note("Micro indisponible : utilisez le champ texte.", true);
    return;
  }
  if (existingStream && typeof MediaRecorder === "undefined") {
    existingStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    setState("listening");
    note("Enregistrement indisponible sur cet appareil.", true);
    return;
  }
  recPending = true;
  let stream = existingStream || null;
  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
      recPending = false;
      setState("listening");
      note("Micro refusé. Autorisez-le dans les réglages de l'application.", true);
      return;
    }
  }
  recPending = false;
  if (existingStream) monitorStream = null;
  if (!session) {
    stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    return;
  }
  mediaStream = stream;
  chunks = [];
  let mr;
  try {
    mr = new MediaRecorder(stream);
  } catch (e) {
    stopStream();
    setState("listening");
    note("Enregistrement indisponible sur cet appareil.", true);
    return;
  }
  recorder = mr;
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    const discard = !!mr._discard;
    const type = mr.mimeType || "audio/webm";
    const blob = new Blob(chunks, { type });
    chunks = [];
    if (recorder === mr) recorder = null;
    stopStream();
    if (session && !USE_SR && (state === "thinking" || state === "speaking")) startBargeMonitor();
    if (discard) return;
    if (blob.size < 1500) { setState("listening"); return; }
    transcribe(blob, type);
  };
  try {
    mr.start();
  } catch (e) {
    recorder = null;
    stopStream();
    setState("listening");
    note("Impossible de démarrer l'enregistrement.", true);
    return;
  }
  startVad(stream, assumeSpeech);
  setState("recording");
}

function stopRecording(discard) {
  if (!recorder) return;
  if (discard) recorder._discard = true;
  try { recorder.stop(); } catch (e) {}
}

async function transcribe(blob, type) {
  setState("thinking");
  if (sttCtrl) sttCtrl.abort();
  const c = sttCtrl = new AbortController();
  const g0 = gen;
  try {
    const r = await fetch(`${apiBase()}/stt`, {
      method: "POST",
      signal: c.signal,
      headers: { "Content-Type": type },
      body: blob,
    });
    if (!session || c.signal.aborted || sttCtrl !== c || g0 !== gen) return;
    if (!r.ok) {
      let msg = "Transcription impossible.";
      try {
        const j = await r.json();
        if (j && j.error) msg = j.error;
      } catch (e) {}
      if (!session || c.signal.aborted || sttCtrl !== c || g0 !== gen) return;
      note(msg, true);
      setState("listening");
      return;
    }
    const j = await r.json();
    if (!session || c.signal.aborted || sttCtrl !== c || g0 !== gen) return;
    const text = (j && typeof j.text === "string" ? j.text : "").trim();
    if (!text) {
      note("Rien entendu, commandant.", true);
      setState("listening");
      return;
    }
    $("#you").textContent = text;
    send(text);
  } catch (e) {
    if (e.name === "AbortError" || sttCtrl !== c) return;
    note("Transcription impossible : backend injoignable.", true);
    setState("listening");
  } finally {
    if (sttCtrl === c) sttCtrl = null;
  }
}

/* ---------- Flux conversation ---------- */
function maybeResume() {
  if (streaming || pending > 0 || !session) return;
  setState("listening");
  if (USE_SR) { if (!rec) listen(); }
  else if (monitor) {
    const s = monitorStream;
    stopMonitor(true);
    monitorStream = null;
    if (s) startRecording(s);
  }
  else if (!recorder && !recPending) startRecording();
}

function interrupt(resume = true) {
  stopMonitor();
  stopPiper();
  if (pendingTurn) discardPendingTurn(pendingTurn);
  if (sttCtrl) { sttCtrl.abort(); sttCtrl = null; }
  gen++;
  pending = 0;
  ttsIds.clear();
  streaming = false;
  clearTimeout(ackTimer);
  if (ctrl) ctrl.abort();
  if (HAS_TTS) window.speechSynthesis.cancel();
  if (window.NativeTTS && typeof window.NativeTTS.stop === "function") {
    try { window.NativeTTS.stop(); } catch (e) {}
  }
  if (!session) { setState("off"); return; }
  setState("listening");
  if (resume && session) {
    if (USE_SR) { if (!rec) listen(); }
    else if (!recorder && !recPending) startRecording();
  }
}

function onEvent(ev, g, turn) {
  if (g !== gen) return;
  if (ev.s) {
    if (turn) {
      if (turn.mode === "regenerate" && !turn.tarsEl && turn.previousAssistant) {
        const index = conversation.lastIndexOf(turn.previousAssistant);
        if (index >= 0) conversation.splice(index, 1);
        turn.previousRemoved = true;
        removeLastJournalAssistant();
      }
      if (!turn.tarsEl) {
        turn.tarsEl = journalMessage("assistant", "");
        $("#history").appendChild(turn.tarsEl);
      }
      turn.assistant += (turn.assistant ? " " : "") + String(ev.s).trim();
      const body = turn.tarsEl.querySelector(".jtext");
      if (body) body.textContent = turn.assistant;
      scrollJournal();
    }
    if (!gotFirst) {
      gotFirst = true;
      clearTimeout(ackTimer);
      setState("speaking");
      startBargeMonitor();
    }
    appendReply(ev.s);
    say(ev.s);
  }
  startBargeMonitor();
  if (ev.error) {
    if (turn) turn.failed = true;
    note(ev.error, true);
  }
  if (ev.done && ev.settings) {
    settings = ev.settings;
    renderGauges();
  }
}

async function readChatStream(response, g, turn) {
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let index;
    while ((index = buffer.indexOf("\n")) >= 0) {
      const line = buffer.slice(0, index).trim();
      buffer = buffer.slice(index + 1);
      if (line) onEvent(JSON.parse(line), g, turn);
    }
  }
}

async function streamChatRequest(payload, g, turn) {
  const response = await fetch(`${apiBase()}/chat`, {
    method: "POST",
    signal: ctrl.signal,
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!response.ok) {
    let message = "HTTP " + response.status;
    try {
      const data = await response.json();
      if (data && data.error) message = data.error;
    } catch (e) {}
    const error = new Error(message);
    error.status = response.status;
    throw error;
  }
  await readChatStream(response, g, turn);
}

async function send(text) {
  if (!text) { maybeResume(); return; }
  interrupt(false);
  const g = gen;
  $("#you").textContent = text;
  clearReply();
  setState("thinking");
  startBargeMonitor();
  streaming = true;
  gotFirst = false;
  ackTimer = setTimeout(() => {
    if (!gotFirst && g === gen) playAck();
  }, 250);
  ctrl = new AbortController();
  conversation.push({ role: "user", content: text });
  const turn = startPendingTurn("send", text);
  turn.userIndex = conversation.length - 1;
  $("#history").appendChild(journalMessage("user", text));
  scrollJournal();

  try {
    await streamChatRequest({ text }, g, turn);
    if (turn.failed) discardPendingTurn(turn);
    else commitPendingTurn(turn);
  } catch (e) {
    if (e.name !== "AbortError" && g === gen) {
      if (!turn.assistant.trim()) {
        note("Mode local : backend non disponible.", true);
        const reply = `Je suis en mode local. Vous avez dit : "${text}".`;
        turn.assistant = reply;
        setPendingAssistantText(turn, reply);
        appendReply(reply);
        say(reply);
        commitPendingTurn(turn);
      } else {
        note("Liaison interrompue, commandant.", true);
        discardPendingTurn(turn);
      }
    }
  } finally {
    if (g === gen) {
      streaming = false;
      clearTimeout(ackTimer);
      maybeResume();
      if (!session && !pending && pendingTurn === null) {
        state = "off";
        document.body.dataset.state = "off";
      }
    }
  }
}

async function regenerateLast() {
  if (streaming || pendingTurn) { historyStatus("Réponse en cours, commandant.", true); return; }
  if (!currentSessionId) { historyStatus("Session courante inconnue, commandant.", true); return; }
  const last = conversation[conversation.length - 1];
  const previous = conversation[conversation.length - 2];
  if (!last || last.role !== "assistant" || !previous || previous.role !== "user") {
    historyStatus("Rien à régénérer.", true);
    return;
  }
  interrupt(false);
  const g = gen;
  $("#you").textContent = previous.content;
  clearReply();
  setState("thinking");
  startBargeMonitor();
  streaming = true;
  gotFirst = false;
  ackTimer = setTimeout(() => {
    if (!gotFirst && g === gen) playAck();
  }, 250);
  ctrl = new AbortController();
  const turn = startPendingTurn("regenerate", previous.content);
  turn.previousAssistant = last;

  try {
    await streamChatRequest({ regenerate: true, session: currentSessionId, user: previous.content }, g, turn);
    if (turn.failed || !turn.assistant.trim()) discardPendingTurn(turn);
    else {
      commitPendingTurn(turn);
      historyStatus("Réponse régénérée");
      note("Réponse régénérée, commandant.");
    }
  } catch (e) {
    if (e.name !== "AbortError" && g === gen) {
      if (e.status === 409) {
        historyStatus(e.message || "rien à régénérer", true);
        note(e.message || "Rien à régénérer, commandant.", true);
      } else {
        historyStatus("Régénération impossible : " + (e.message || "backend absent"), true);
        note("Mode local : backend non disponible.", true);
      }
      discardPendingTurn(turn);
    }
  } finally {
    if (g === gen) {
      streaming = false;
      clearTimeout(ackTimer);
      maybeResume();
      if (!session && !pending && pendingTurn === null) {
        state = "off";
        document.body.dataset.state = "off";
      }
    }
  }
}

/* ---------- Session ---------- */
async function startSession() {
  if (!USE_SR && (typeof MediaRecorder === "undefined" || !navigator.mediaDevices)) {
    note("Reconnaissance vocale absente. Utilisez le champ texte.", true);
    return;
  }

  session = true;
  setState("listening");
  if (USE_SR) listen();
  else startRecording();
  try { wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

function endSession() {
  session = false;
  interrupt(false);
  stopMonitor();
  stopRec();
  stopRecording(true);
  setState("off");
  if (wake) {
    wake.release().catch(() => {});
    wake = null;
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    $("#slab").click();
  }
  if (e.key === 'Escape') {
    endSession();
  }
});
