/* ---------- Réglages clé API ---------- */
async function loadConfig() {
  const el = $("#groq-status");
  try {
    const r = await fetch(`${apiBase()}/config`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const c = await r.json();
    if (c && typeof c.groq_model === "string" && c.groq_model) {
      $("#groq-model").value = c.groq_model;
    }
    el.textContent = c && c.has_groq ? "Clé Groq : configurée" : "Clé Groq : absente";
    el.classList.toggle("ok", !!(c && c.has_groq));
  } catch (e) {
    el.textContent = "Réglages indisponibles";
    el.classList.remove("ok");
  }
}

async function saveConfig(extra) {
  const el = $("#groq-status");
  const payload = { groq_model: $("#groq-model").value.trim() };
  const key = $("#groq-key").value.trim();
  if (key) payload.groq_api_key = key;
  Object.assign(payload, extra || {});
  el.textContent = "Enregistrement…";
  el.classList.remove("ok");
  try {
    const r = await fetch(`${apiBase()}/config`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    $("#groq-key").value = "";
    el.textContent = "Enregistré";
    el.classList.add("ok");
    setTimeout(loadConfig, 1200);
  } catch (e) {
    el.textContent = "Erreur : " + (e.message || "enregistrement impossible");
    el.classList.remove("ok");
  }
}

/* ---------- Diagnostic ---------- */
function diagLine(label, value, isError) {
  const line = document.createElement("div");
  line.className = "diag-line";
  const key = document.createElement("span");
  key.className = "diag-key";
  key.textContent = label;
  const val = document.createElement("span");
  val.className = "diag-val" + (isError ? " bad" : "");
  val.textContent = value;
  line.appendChild(key);
  line.appendChild(val);
  return line;
}

function renderDiagnostic(data) {
  const box = $("#diag-lines");
  box.textContent = "";
  const llm = data.llm || {};
  const providers = Array.isArray(llm.providers) ? llm.providers : [];
  const configured = providers.filter(provider => provider && provider.configured);
  const providerText = configured.length
    ? configured.map(provider => provider.name + (provider.model ? " · " + provider.model : "")).join(", ")
    : "aucun fournisseur configuré";
  const active = llm.active || (llm.mock ? "mock" : "aucun");
  const stt = data.stt || {};
  const piper = (data.tts && data.tts.piper) || {};
  const memory = data.memory || {};
  const history = data.history || {};
  const lastError = data.last_error;

  box.appendChild(diagLine("Serveur", data.server && data.server.ok !== false ? "opérationnel" : "hors service", !(data.server && data.server.ok !== false)));
  box.appendChild(diagLine("Auth", data.auth && data.auth.ok ? "session valide" : "non authentifié", !(data.auth && data.auth.ok)));
  box.appendChild(diagLine("Cerveau", active + (llm.mock ? " (mock)" : "") + (llm.ok ? "" : " — indisponible"), !llm.ok));
  box.appendChild(diagLine("Fournisseurs", providerText));
  box.appendChild(diagLine("STT", (stt.model || "—") + (stt.ok ? "" : " — clé absente"), !stt.ok));
  box.appendChild(diagLine("Piper", piper.available ? ("disponible" + (piper.model ? " · " + piper.model : "")) : "indisponible — repli système", !piper.available));
  box.appendChild(diagLine("Mémoire", (Number(memory.count) || 0) + " fait(s)"));
  box.appendChild(diagLine("Historique", (Number(history.sessions) || 0) + " session(s) · courante " + (history.current || "—")));
  box.appendChild(diagLine(
    "Dernière erreur",
    lastError && lastError.message
      ? lastError.message + (lastError.source ? " (" + lastError.source + ")" : "") + (lastError.at ? " · " + formatDate(lastError.at) : "")
      : "aucune",
    !!(lastError && lastError.message)
  ));
}

async function refreshPiperStatus() {
  try {
    const response = await fetch(`${apiBase()}/diagnostic`, { credentials: "same-origin" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    setPiperAvailability(!!(data.tts && data.tts.piper && data.tts.piper.available));
  } catch (e) {
    setPiperAvailability(null);
  }
}

async function runDiagnostic() {
  const status = $("#diag-status");
  if (status) { status.textContent = "Vérification…"; status.classList.remove("ok"); status.classList.remove("err"); }
  try {
    const response = await fetch(`${apiBase()}/diagnostic`, { credentials: "same-origin" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    renderDiagnostic(data);
    setPiperAvailability(!!(data.tts && data.tts.piper && data.tts.piper.available));
    if (status) { status.textContent = "OK"; status.classList.add("ok"); }
  } catch (e) {
    const box = $("#diag-lines");
    box.textContent = "";
    box.appendChild(diagLine("État", "Diagnostic indisponible (" + (e.message || "backend absent") + ")", true));
    if (status) { status.textContent = "Échec"; status.classList.add("err"); }
  }
}

/* ---------- Mémoire ---------- */
function memoryStatus(message, isError) {
  const el = $("#memory-status");
  if (!el) return;
  el.textContent = message || "";
  el.classList.toggle("err", !!isError);
  el.classList.toggle("ok", !isError && /enregistr|fait/i.test(message || ""));
}

function memoryItem(fact) {
  const item = document.createElement("article");
  item.className = "mem-item";
  if (memoryEditingId === fact.id) {
    const textarea = document.createElement("textarea");
    textarea.value = fact.text;
    textarea.maxLength = 500;
    textarea.rows = 3;
    textarea.setAttribute("aria-label", "Modifier le fait");
    const actions = document.createElement("div");
    actions.className = "mem-actions";
    const save = document.createElement("button");
    save.type = "button";
    save.className = "ghost";
    save.textContent = "Valider";
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "ghost";
    cancel.textContent = "Annuler";
    save.addEventListener("click", async () => {
      const text = textarea.value.trim();
      if (!text) return;
      memoryEditingId = null;
      await memoryAction({ action: "update", id: fact.id, text });
    });
    cancel.addEventListener("click", () => {
      memoryEditingId = null;
      renderMemory();
    });
    actions.appendChild(save);
    actions.appendChild(cancel);
    item.appendChild(textarea);
    item.appendChild(actions);
    return item;
  }
  const text = document.createElement("p");
  text.className = "mem-text";
  text.textContent = fact.text;
  const meta = document.createElement("div");
  meta.className = "mem-meta";
  const source = document.createElement("span");
  source.textContent = fact.source || "—";
  const date = document.createElement("span");
  date.textContent = formatDate(fact.created);
  meta.appendChild(source);
  meta.appendChild(date);
  const actions = document.createElement("div");
  actions.className = "mem-actions";
  const edit = document.createElement("button");
  edit.type = "button";
  edit.className = "ghost";
  edit.textContent = "Modifier";
  edit.addEventListener("click", () => {
    memoryEditingId = fact.id;
    renderMemory();
  });
  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "ghost";
  remove.textContent = "Supprimer";
  remove.addEventListener("click", async () => {
    if (!window.confirm("Supprimer ce fait de la mémoire de TARS ?")) return;
    await memoryAction({ action: "delete", id: fact.id });
  });
  actions.appendChild(edit);
  actions.appendChild(remove);
  item.appendChild(text);
  item.appendChild(meta);
  item.appendChild(actions);
  return item;
}

function renderMemory() {
  const list = $("#memory-list");
  list.textContent = "";
  const count = $("#memory-count");
  if (count) count.textContent = String(memoryFacts.length);
  if (!memoryFacts.length) {
    const empty = document.createElement("p");
    empty.className = "mem-empty";
    empty.textContent = "Aucun fait enregistré.";
    list.appendChild(empty);
    return;
  }
  for (const fact of memoryFacts) list.appendChild(memoryItem(fact));
}

async function loadMemory() {
  if (memoryLoading) { memoryReloadPending = true; return; }
  memoryLoading = true;
  memoryStatus("Chargement…");
  try {
    const response = await fetch(`${apiBase()}/memory`, { credentials: "same-origin" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    memoryFacts = Array.isArray(data.facts) ? data.facts : [];
    renderMemory();
    memoryStatus(memoryFacts.length + " fait" + (memoryFacts.length > 1 ? "s" : ""));
  } catch (e) {
    memoryStatus("Mémoire indisponible : " + (e.message || "backend absent"), true);
  } finally {
    memoryLoading = false;
    if (memoryReloadPending) {
      memoryReloadPending = false;
      loadMemory();
    }
  }
}

async function memoryAction(payload) {
  memoryStatus("Enregistrement…");
  try {
    const response = await fetch(`${apiBase()}/memory`, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
    memoryEditingId = null;
    await loadMemory();
    memoryStatus("Enregistré");
  } catch (e) {
    memoryStatus("Erreur : " + (e.message || "mémoire non enregistrée"), true);
  }
}

async function exportMemory() {
  try {
    const response = await fetch(`${apiBase()}/memory/export`, { credentials: "same-origin" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    downloadBlob(await response.blob(), "tars-memoire.md");
    memoryStatus("Export prêt");
  } catch (e) {
    memoryStatus("Export impossible : " + (e.message || "backend absent"), true);
  }
}

/* ---------- Historique de sessions ---------- */
function historyStatus(message, isError) {
  const el = $("#history-status");
  if (!el) return;
  el.textContent = message || "";
  el.classList.toggle("err", !!isError);
  el.classList.toggle("ok", !isError && /ouverte|session|régénérée/i.test(message || ""));
}

function renderHistory() {
  const list = $("#history-list");
  list.textContent = "";
  const count = $("#history-count");
  if (count) count.textContent = String(historySessions.length);
  const query = ($("#history-search").value || "").trim().toLowerCase();
  const filtered = historySessions.filter(session => {
    if (!query) return true;
    return [session.title, session.preview, session.id].some(value =>
      String(value || "").toLowerCase().includes(query));
  });
  if (!filtered.length) {
    const empty = document.createElement("p");
    empty.className = "hist-empty";
    empty.textContent = query ? "Aucune session trouvée." : "Aucune session enregistrée.";
    list.appendChild(empty);
    return;
  }
  for (const session of filtered) {
    const item = document.createElement("div");
    item.className = "hist-item" + (session.id === currentSessionId ? " current" : "");
    const head = document.createElement("div");
    head.className = "hist-head";
    const title = document.createElement("span");
    title.className = "hist-title";
    title.textContent = session.title || "Sans titre";
    const badge = document.createElement("span");
    badge.className = "hist-badge";
    badge.textContent = session.id === currentSessionId ? "courante" : "";
    head.appendChild(title);
    head.appendChild(badge);
    const meta = document.createElement("p");
    meta.className = "hist-meta";
    meta.textContent = formatDate(session.updated) + " · " + (Number(session.turns) || 0) + " tour(s)";
    const preview = document.createElement("p");
    preview.className = "hist-preview";
    preview.textContent = session.preview || "";
    const open = document.createElement("button");
    open.type = "button";
    open.className = "ghost hist-open";
    open.textContent = "Ouvrir";
    open.addEventListener("click", () => openHistory(session.id));
    item.appendChild(head);
    item.appendChild(meta);
    item.appendChild(preview);
    item.appendChild(open);
    list.appendChild(item);
  }
}

async function loadHistory(options = {}) {
  try {
    const response = await fetch(`${apiBase()}/history`, { credentials: "same-origin" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    historySessions = Array.isArray(data.sessions) ? data.sessions : [];
    if (data.current) currentSessionId = data.current;
    renderHistory();
    if (!options.silent) historyStatus(historySessions.length + " session(s)");
    return data;
  } catch (e) {
    if (!options.silent) historyStatus("Historique indisponible : " + (e.message || "backend absent"), true);
    return null;
  }
}

async function restoreCurrentSession() {
  const startGen = gen;
  const data = await loadHistory({ silent: true });
  if (!data || !data.current) return;
  if (startGen !== gen || streaming || pendingTurn || conversation.length > 0) return;
  try {
    const response = await fetch(`${apiBase()}/history/${encodeURIComponent(data.current)}`, {
      credentials: "same-origin",
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const session = await response.json();
    if (startGen !== gen || streaming || pendingTurn || conversation.length > 0) return;
    const messages = Array.isArray(session.messages) ? session.messages : [];
    conversation = messages
      .map(message => ({
        role: message.role === "assistant" ? "assistant" : "user",
        content: String(message.content || ""),
      }))
      .filter(message => message.content);
    currentSessionId = session.id || data.current;
    pendingTurn = null;
    renderJournal();
  } catch (e) {}
}

async function openHistory(id) {
  if (!id) return;
  interrupt(false);
  stopRec();
  stopRecording(true);
  historyStatus("Ouverture…");
  try {
    const response = await fetch(`${apiBase()}/history/open`, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
    const messages = Array.isArray(data.messages) ? data.messages : [];
    conversation = messages
      .map(message => ({
        role: message.role === "assistant" ? "assistant" : "user",
        content: String(message.content || ""),
      }))
      .filter(message => message.content);
    currentSessionId = data.id || id;
    pendingTurn = null;
    renderJournal();
    historyStatus("Session ouverte");
    await loadHistory({ silent: true });
    if (session) {
      setState("listening");
      if (USE_SR) { if (!rec) listen(); }
      else if (!recorder && !recPending) startRecording();
    }
  } catch (e) {
    historyStatus("Ouverture impossible : " + (e.message || "erreur"), true);
  }
}

async function newSession() {
  interrupt(false);
  stopRec();
  stopRecording(true);
  historyStatus("Création…");
  try {
    const response = await fetch(`${apiBase()}/history/new`, {
      method: "POST",
      credentials: "same-origin",
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
    currentSessionId = data.id || "";
    conversation = [];
    pendingTurn = null;
    $("#history").textContent = "";
    $("#you").textContent = "";
    clearReply();
    historyStatus("Nouvelle session");
    await loadHistory({ silent: true });
    if (session) {
      setState("listening");
      if (USE_SR) { if (!rec) listen(); }
      else if (!recorder && !recPending) startRecording();
    }
  } catch (e) {
    historyStatus("Nouvelle session impossible : " + (e.message || "erreur"), true);
  }
}

function exportConversation() {
  if (!conversation.length) {
    historyStatus("Rien à exporter.", true);
    return;
  }
  const lines = ["# TARS — conversation", "", "Session : " + (currentSessionId || "courante"), ""];
  for (const message of conversation) {
    lines.push(message.role === "assistant" ? "## TARS" : "## Vous");
    lines.push("");
    lines.push(message.content);
    lines.push("");
  }
  const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
  downloadBlob(blob, "tars-session-" + (currentSessionId || "courante") + ".md");
  historyStatus("Export prêt");
}

$("#save-config").addEventListener("click", () => saveConfig());

$("#clear-key").addEventListener("click", () => {
  $("#groq-key").value = "";
  saveConfig({ groq_api_key: "" });
});

/* ---------- Événements diagnostic / mémoire / historique / Piper ---------- */
$("#diag-run").addEventListener("click", runDiagnostic);
$("#memory-block").addEventListener("toggle", event => { if (event.target.open) loadMemory(); });
$("#history-block").addEventListener("toggle", event => { if (event.target.open) loadHistory(); });
$("#memory-refresh").addEventListener("click", loadMemory);
$("#memory-export").addEventListener("click", exportMemory);
$("#memory-clear").addEventListener("click", async () => {
  if (!memoryFacts.length) return;
  if (!window.confirm("Effacer toute la mémoire de TARS ?")) return;
  await memoryAction({ action: "clear" });
});
$("#memory-form").addEventListener("submit", async event => {
  event.preventDefault();
  const input = $("#memory-input");
  const text = input.value.trim();
  if (!text) return;
  await memoryAction({ action: "add", text });
  if (input.value.trim() === text) input.value = "";
});

$("#history-new").addEventListener("click", newSession);

$("#history-export").addEventListener("click", exportConversation);
$("#history-regen").addEventListener("click", regenerateLast);
$("#piper-enabled").addEventListener("change", event => {
  piperEnabled = event.target.checked;
  piperPref = piperEnabled;
  try { localStorage.setItem("tars.piper", piperEnabled ? "1" : "0"); } catch (e) {}
  if (piperEnabled) piperBroken = false;
  else {
    stopPiper();
    pending = 0;
    maybeResume();
  }
  setPiperAvailability(piperAvailable);
  if (piperEnabled) refreshPiperStatus();
});

/* ---------- Événements ---------- */
$("#slab").addEventListener("click", () => {
  if (!session) {
    if (state === "off") startSession();
    else interrupt(false);
    return;
  }
  if (state === "off") startSession();
  else if (state === "thinking" || state === "speaking") interrupt(true);
  else if (state === "recording") stopRecording();
  else if (!USE_SR) startRecording();
  else endSession();
});

$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("#txt").value.trim();
  $("#txt").value = "";
  if (t) {
    stopRec();
    stopRecording(true);
    send(t);
  }
});

$("#voice-preset").addEventListener("change", e => {
  const p = VOICE_PRESETS[e.target.value];
  if (!p) return;
  voicePrefs.preset = e.target.value; voicePrefs.pitch = p.pitch; voicePrefs.rate = p.rate;
  saveVoicePrefs(); syncVoiceUI();
});
for (const [id, key] of [["#voice-pitch", "pitch"], ["#voice-rate", "rate"]]) {
  $(id).addEventListener("input", e => {
    voicePrefs[key] = Number(e.target.value); voicePrefs.preset = "custom";
    saveVoicePrefs(); syncVoiceUI();
    $("#voice-preset").value = "";
  });
}
$("#voice-pick").addEventListener("change", e => {
  voicePrefs.name = e.target.value; saveVoicePrefs(); pickVoice();
});
$("#voice-test").addEventListener("click", speakTest);
$("#settings-close").addEventListener("click", () => $("#settings").classList.remove("open"));
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#settings").classList.remove("open"); });

syncVoiceUI();
$("#piper-enabled").checked = piperEnabled;
setPiperAvailability(null);
renderGauges();
loadConfig();
refreshPiperStatus();
if (isWidget) loadHistory({ silent: true });
else restoreCurrentSession();
</script>
