<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>TARS pas tars</title>
<style>
  :root {
    --bg: #0a0a0a;
    --slab: #1a1a1a;
    --seam: #000;
    --lit: #0f0;
    --dim: #2a2a2a;
    --text: #e0e0e0;
    --mute: #666;
    --warn: #ff5500;
    --primary: #00ff88;
    box-sizing: border-box;
  }
  
  *, *::before, *::after { 
    box-sizing: inherit; 
    margin: 0; 
    padding: 0;
  }
  
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 'Courier New', 'SF Mono', monospace;
  }
  
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    background-image: 
      radial-gradient(circle at 1px 1px, rgba(0, 255, 0, 0.1) 1px, transparent 0);
    background-size: 20px 20px;
  }

  /* Mode Widget */
  body.widget-mode {
    width: 200px;
    height: 120px;
    background: var(--slab);
    border-radius: 8px;
    padding: 8px;
    border: 1px solid var(--dim);
  }
  body.widget-mode main {
    max-width: 100%;
    padding: 0;
    gap: 8px;
  }
  body.widget-mode #status {
    font-size: 14px;
    min-height: 1.2em;
  }
  body.widget-mode #slab {
    width: 50px;
    height: 50px;
  }
  body.widget-mode #slab i {
    height: 8px;
  }
  body.widget-mode #history,
  body.widget-mode #you,
  body.widget-mode #tars,
  body.widget-mode .gauges,
  body.widget-mode form,
  body.widget-mode label.opt {
    display: none;
  }
  
  /* Mode embarqué (Electron/Capacitor) */
  body.embedded {
    padding: 0;
  }
  body.embedded main {
    padding: 10px;
  }

  /* Conteneur principal */
  main {
    width: 100%;
    max-width: 500px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 10px;
    gap: 15px;
  }

  /* Statut */
  #status {
    margin: 0;
    color: var(--primary);
    min-height: 1.5em;
    text-align: center;
    font-size: 15px;
    text-shadow: 0 0 5px var(--primary);
    padding: 8px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 4px;
  }
  #status.err {
    color: var(--warn);
    text-shadow: 0 0 5px var(--warn);
  }

  /* Historique des conversations */
  #history {
    flex: 1;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--dim);
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    line-height: 1.6;
    max-height: 300px;
    min-height: 100px;
  }
  #history p {
    margin: 5px 0;
    padding: 4px 8px;
    border-radius: 3px;
  }
  #history p strong {
    color: var(--primary);
  }
  #history .user {
    background: rgba(0, 255, 0, 0.1);
    border-left: 3px solid var(--primary);
  }
  #history .tars {
    background: rgba(0, 0, 0, 0.2);
    border-left: 3px solid var(--dim);
  }

  /* Monolithe (bouton TARS) */
  #slab {
    align-self: center;
    width: 120px;
    height: 120px;
    padding: 0;
    border: 0;
    background: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  
  #slab::before {
    content: '';
    position: absolute;
    inset: -15px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  
  #slab:hover::before {
    opacity: 0.3;
  }
  
  #slab:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 4px;
  }
  
  #slab i {
    flex: 1;
    position: relative;
    background: var(--slab);
    border-radius: 4px;
    box-shadow: inset 0 1px 0 var(--dim), inset 0 -2px 0 var(--seam);
    transition: transform 0.35s ease, background 0.3s;
  }
  
  #slab i::after {
    content: "";
    position: absolute;
    left: 18%;
    right: 18%;
    top: 50%;
    height: 2px;
    margin-top: -1px;
    background: var(--dim);
    border-radius: 1px;
    transition: background 0.3s, box-shadow 0.3s, transform 0.3s;
  }
  
  body[data-state="listening"] #slab i::after {
    background: var(--primary);
    animation: breathe 2.4s ease-in-out infinite;
  }
  
  body[data-state="speaking"] #slab i::after {
    background: var(--primary);
    box-shadow: 0 0 15px var(--primary);
    animation: talk 0.7s ease-in-out infinite;
  }
  
  body[data-state="speaking"] #slab i:nth-child(2)::after { animation-delay: .15s; }
  body[data-state="speaking"] #slab i:nth-child(3)::after { animation-delay: .3s; }
  body[data-state="speaking"] #slab i:nth-child(4)::after { animation-delay: .45s; }
  
  body[data-state="thinking"] #slab i:nth-child(odd) { 
    animation: shift 1.1s ease-in-out infinite; 
  }
  body[data-state="thinking"] #slab i:nth-child(even) { 
    animation: shift 1.1s ease-in-out infinite reverse; 
  }
  body[data-state="thinking"] #slab i::after { 
    background: var(--mute); 
  }
  
  @keyframes breathe {
    50% { opacity: .35; }
  }
  @keyframes talk {
    50% { opacity: .4; box-shadow: 0 0 5px var(--primary); }
  }
  @keyframes shift {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(12px); }
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(0, 255, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); }
  }
  
  body[data-state="speaking"] #slab {
    animation: pulse 1s infinite;
  }
  
  @media (prefers-reduced-motion: reduce) {
    #slab i, #slab i::after { animation: none !important; }
  }

  /* Zone de discussion */
  .talk {
    width: 100%;
    min-height: 100px;
    padding: 12px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--dim);
    border-radius: 6px;
  }
  
  .talk p {
    margin: 8px 0;
    max-width: 100%;
    word-wrap: break-word;
  }
  
  #you {
    color: var(--mute);
    font-style: italic;
  }
  
  #tars {
    color: var(--text);
    font-weight: 500;
  }
  
  .talk small {
    display: block;
    color: var(--mute);
    font-size: 12px;
    margin-top: 8px;
  }

  /* Jauges de réglage */
  .gauges {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 14px;
    align-items: center;
    width: 100%;
    padding: 12px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--dim);
    border-radius: 6px;
  }
  
  .gauges span {
    color: var(--mute);
    font-size: 14px;
  }
  
  .bar {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 3px;
  }
  
  .bar b {
    height: 6px;
    background: var(--dim);
    border-radius: 2px;
    transition: background 0.3s;
  }
  
  .bar b.on {
    background: var(--primary);
    box-shadow: 0 0 5px var(--primary);
  }

  /* Options */
  label.opt {
    display: flex;
    gap: 10px;
    align-items: center;
    color: var(--mute);
    font-size: 14px;
    cursor: pointer;
    padding: 8px;
    border-radius: 4px;
    transition: background 0.3s;
  }
  
  label.opt:hover {
    background: rgba(0, 255, 0, 0.1);
  }
  
  label.opt input {
    accent-color: var(--primary);
  }

  /* Formulaire */
  form {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  
  input[type=text] {
    flex: 1;
    min-width: 0;
    padding: 12px 15px;
    font: inherit;
    color: var(--text);
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--dim);
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  
  input[type=text]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(0, 255, 0, 0.2);
  }
  
  button.send {
    padding: 12px 20px;
    font: inherit;
    color: var(--bg);
    background: var(--primary);
    border: 0;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.3s, transform 0.1s;
    font-weight: bold;
  }
  
  button.send:hover {
    background: #00cc6a;
    transform: scale(1.05);
  }
  
  button.send:active {
    transform: scale(0.95);
  }
  
  input:focus-visible,
  button.send:focus-visible,
  label.opt input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  /* Animation de chargement */
  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--primary);
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    main {
      padding: 15px 10px;
    }
    #slab {
      width: 100px;
      height: 100px;
    }
    .gauges {
      grid-template-columns: 1fr;
      gap: 8px;
    }
  }

  /* Scrollbar stylisée */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  
  ::-webkit-scrollbar-track {
    background: var(--dim);
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb:hover {
    background: #00cc6a;
  }
</style>
</head>
<body data-state="off">
<main>
  <p id="status" role="status" aria-live="polite">Appuyez sur le monolithe pour commencer, commandant.</p>
  
  <div id="history"></div>
  
  <button id="slab" aria-label="Démarrer, interrompre ou arrêter TARS">
    <i></i><i></i><i></i><i></i>
  </button>

  <div class="talk" aria-live="polite">
    <p id="you"></p>
    <p id="tars"></p>
  </div>

  <div class="gauges">
    <span>Humour</span><div class="bar" id="g-humour"></div>
    <span>Honnêteté</span><div class="bar" id="g-honnetete"></div>
  </div>
  
  <label class="opt">
    <input type="checkbox" id="casque"> 
    <span>Casque branché : parler par-dessus TARS l'interrompt</span>
  </label>
  
  <form id="form" autocomplete="off">
    <input type="text" id="txt" placeholder="Ou écrivez ici..." aria-label="Message écrit">
    <button class="send" type="submit">Envoyer</button>
  </form>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const BACKEND_URL = "http://localhost:8000";
const TOKEN = "";
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

let state = "off", session = false, rec = null, ctrl = null, wake = null;
let gen = 0, pending = 0, streaming = false, gotFirst = false, ackTimer = null, lastAck = "";
let settings = { humour: 60, honnetete: 90 };
let voice = null;
let isWidget = new URLSearchParams(location.search).has("widget");

// Détecter si on est en mode embarqué
const isEmbedded = (
  typeof window.electronAPI !== 'undefined' ||
  (window.Capacitor && window.Capacitor.getPlatform() !== 'web')
);
if (isEmbedded) {
  document.body.classList.add('embedded');
}

// Activer le mode widget si demandé
if (isWidget) {
  document.body.classList.add("widget-mode");
}

/* ---------- Affichage ---------- */
const LABELS = { 
  off: "Appuyez sur le monolithe, commandant.", 
  listening: "Je vous écoute, commandant.", 
  thinking: "Réflexion en cours...", 
  speaking: ""
};

function setState(s) {
  state = s; 
  document.body.dataset.state = s;
  if (LABELS[s] !== undefined) note(LABELS[s]);
}

function note(msg, err) {
  const el = $("#status"); 
  el.textContent = msg; 
  el.classList.toggle("err", !!err);
}

function renderGauges() {
  for (const k of ["humour", "honnetete"]) {
    const n = Math.round(settings[k] / 10), el = $("#g-" + k);
    el.setAttribute("title", settings[k] + " %");
    el.innerHTML = Array.from({ length: 10 }, (_, i) => `<b class="${i < n ? "on" : ""}"></b>`).join("");
  }
}

/* ---------- Historique ---------- */
function addToHistory(userText, tarsText) {
  const historyDiv = $("#history");
  if (userText) {
    historyDiv.innerHTML += `<p class="user"><strong>Toi:</strong> ${userText}</p>`;
  }
  if (tarsText) {
    historyDiv.innerHTML += `<p class="tars"><strong>TARS:</strong> ${tarsText}</p>`;
  }
  historyDiv.scrollTop = historyDiv.scrollHeight;
}

/* ---------- Synthèse vocale ---------- */
const ACK_AUDIO = {
  court: [],
  reflexion: [],
  drole: []
};

function loadAudioClips() {
  const originalClips = {
    court: ["affirmative", "systems_nominal", "yes", "roger_that"],
    reflexion: ["humor_100", "calculating", "working"],
    drole: ["not_babysitter", "sarcasm", "joke"]
  };
  
  for (const [category, clips] of Object.entries(originalClips)) {
    clips.forEach(clip => {
      const audio = new Audio(`${BACKEND_URL}/static/acks/tars_original/${clip}.mp3`);
      audio.preload = "auto";
      ACK_AUDIO[category].push(audio);
    });
  }
  
  if (ACK_AUDIO.court.length === 0) {
    const dummyClips = {
      court: ["recu", "mmh", "compris", "bien_recus", "ok"],
      reflexion: ["hm_voyons", "une_seconde", "je_reflechis", "laissez_moi_verifier", "attendez"],
      drole: ["recu_je_fais_semblant", "mmh_passionnant", "compris_evidemment", "bien_recus_enfin", "ok_si_vous_le_dites"]
    };
    for (const [category, clips] of Object.entries(dummyClips)) {
      clips.forEach(clip => {
        const audio = new Audio(`${BACKEND_URL}/static/acks/${category}/${clip}.mp3`);
        audio.preload = "auto";
        ACK_AUDIO[category].push(audio);
      });
    }
  }
}

function pickAck(text) {
  const long = text.length > 80 || /expliqu|pourquoi|comment|compar/i.test(text);
  let pool = long ? ACK_AUDIO.reflexion : ACK_AUDIO.court;
  if (settings.humour >= 70) pool = pool.concat(ACK_AUDIO.drole);
  if (settings.humour <= 30) pool = ACK_AUDIO.court.slice(0, 2);
  
  const available = pool.filter(a => a.src !== lastAck);
  if (available.length === 0) return pool[0];
  
  const clip = available[Math.floor(Math.random() * available.length)];
  lastAck = clip.src;
  return clip;
}

function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^fr.*Male/i.test(v.name)) || 
          vs.find(v => /Google fr-FR Standard A/i.test(v.name)) ||
          vs.find(v => /Microsoft.*French.*Male/i.test(v.name)) ||
          vs.find(v => /^fr[-_]FR/i.test(v.lang)) || 
          vs.find(v => /^fr/i.test(v.lang)) || null;
}

if ("speechSynthesis" in window) { 
  pickVoice(); 
  speechSynthesis.onvoiceschanged = pickVoice; 
}

function say(text) {
  if (isWidget) return;
  
  const clip = pickAck(text);
  if (clip && !clip.paused) {
    const playPromise = clip.play();
    if (playPromise !== undefined) {
      playPromise.catch(e => {
        fallbackTTS(text);
      });
    }
    return;
  }
  
  fallbackTTS(text);
}

function fallbackTTS(text) {
  const g = gen, u = new SpeechSynthesisUtterance(text);
  u.lang = "fr-FR"; 
  if (voice) u.voice = voice;
  u.pitch = 0.5; u.rate = 0.85;
  const done = () => { 
    if (g !== gen) return; 
    pending = Math.max(0, pending - 1); 
    maybeResume(); 
  };
  u.onend = done; 
  u.onerror = done;
  pending++; 
  speechSynthesis.speak(u);
}

/* ---------- Reconnaissance vocale ---------- */
function stopRec() { 
  const r = rec; 
  rec = null; 
  if (r) { try { r.abort(); } catch (e) {} } 
}

function wantsMic() { 
  return session && (state === "listening" || $("#casque").checked); 
}

function listen() {
  if (!SR || !session) return;
  stopRec();
  const me = new SR(); rec = me;
  me.lang = "fr-FR"; 
  me.interimResults = true; 
  me.continuous = false;
  me.onresult = e => {
    if (rec !== me) return;
    let txt = "", fin = false;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      txt += e.results[i][0].transcript; 
      if (e.results[i].isFinal) fin = true;
    }
    if (state !== "listening" && $("#casque").checked && txt.trim().length > 2) interrupt(false);
    if (state === "listening") $("#you").textContent = txt;
    if (fin && state === "listening") { 
      stopRec(); 
      send(txt.trim()); 
    }
  };
  me.onerror = e => {
    if (rec !== me) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      note("Micro refusé. Autorisez-le dans les réglages du site.", true);
      endSession();
    }
  };
  me.onend = () => { 
    if (rec === me && wantsMic()) setTimeout(() => { if (rec === me) listen(); }, 150); 
  };
  try { me.start(); } catch (e) { /* déjà démarré */ }
}

/* ---------- Flux conversation ---------- */
function maybeResume() {
  if (streaming || pending > 0 || !session) return;
  setState("listening");
  if (!rec) listen();
}

function interrupt(resume = true) {
  gen++; 
  pending = 0; 
  streaming = false; 
  clearTimeout(ackTimer);
  if (ctrl) ctrl.abort();
  speechSynthesis.cancel();
  setState("listening");
  if (resume && session && !rec) listen();
}

function onEvent(ev, g) {
  if (g !== gen) return;
  if (ev.s) {
    if (!gotFirst) { 
      gotFirst = true; 
      clearTimeout(ackTimer); 
      setState("speaking");
      addToHistory($("#you").textContent, ev.s);
    } else {
      addToHistory("", ev.s);
    }
    $("#tars").textContent += (ev.error ? "" : ($("#tars").textContent ? " " : "")) + ev.s;
    say(ev.s);
  }
  if (ev.error) note(ev.error, true);
  if (ev.done && ev.settings) { 
    settings = ev.settings; 
    renderGauges(); 
  }
}

async function send(text) {
  if (!text) { maybeResume(); return; }
  interrupt(false);
  const g = gen;
  $("#you").textContent = text; 
  $("#tars").textContent = "";
  setState("thinking"); 
  streaming = true; 
  gotFirst = false;
  ackTimer = setTimeout(() => { 
    if (!gotFirst && g === gen) say(pickAck(text)); 
  }, 250);
  ctrl = new AbortController();
  
  try {
    const backendUrl = isEmbedded ? BACKEND_URL : window.location.origin;
    const r = await fetch(`${backendUrl}/chat`, {
      method: "POST", 
      signal: ctrl.signal,
      headers: { "Content-Type": "application/json", "X-Tars-Token": TOKEN },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) {
      throw new Error("Backend non disponible");
    }
    const rd = r.body.getReader(), dec = new TextDecoder(); 
    let buf = "";
    for (;;) {
      const { value, done } = await rd.read(); 
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); 
        buf = buf.slice(i + 1);
        if (line) onEvent(JSON.parse(line), g);
      }
    }
  } catch (e) {
    if (e.name !== "AbortError" && g === gen) {
      note("Mode local : backend non disponible.", true);
      const reply = `Je suis en mode local. Vous avez dit : "${text}".`;
      say(reply);
      addToHistory(text, reply);
      if (g === gen) { 
        streaming = false; 
        clearTimeout(ackTimer); 
        maybeResume(); 
      }
    }
  } finally {
    if (g === gen) { 
      streaming = false; 
      clearTimeout(ackTimer); 
      maybeResume(); 
    }
  }
}

/* ---------- Session ---------- */
async function startSession() {
  if (!SR) { 
    note("Reconnaissance vocale absente. Utilisez Chrome ou le champ texte.", true); 
    return; 
  }
  
  if (isEmbedded && typeof window.electronAPI !== 'undefined') {
    try {
      await window.electronAPI.restartBackend();
      await new Promise(resolve => setTimeout(resolve, 1000));
    } catch (e) {
      console.error("Erreur backend:", e);
    }
  }
  
  session = true; 
  setState("listening"); 
  listen();
  try { wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

function endSession() {
  session = false; 
  interrupt(false); 
  stopRec(); 
  setState("off");
  if (wake) { 
    wake.release().catch(() => {}); 
    wake = null; 
  }
}

/* ---------- Raccourcis clavier ---------- */
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    $("#slab").click();
  }
  if (e.key === 'Escape') {
    endSession();
  }
});

/* ---------- Initialisation ---------- */
loadAudioClips();

fetch("/state", { headers: { "X-Tars-Token": TOKEN } })
  .then(r => r.ok ? r.json() : null)
  .then(s => { 
    if (s) { 
      settings = s; 
      renderGauges(); 
    } 
  })
  .catch(() => {});

// Mettre à jour le widget régulièrement
if (isWidget) {
  setInterval(() => {
    fetch(`${BACKEND_URL}/widget`, { headers: { "X-Tars-Token": TOKEN } })
      .then(r => r.json())
      .then(data => {
        if (data.status) {
          note(`TARS: ${data.status}`);
        }
      })
      .catch(() => {});
  }, 1000);
}

/* ---------- Événements ---------- */
$("#slab").addEventListener("click", () => {
  if (state === "off") startSession();
  else if (state === "thinking" || state === "speaking") interrupt(true);
  else endSession();
});

$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("#txt").value.trim(); 
  $("#txt").value = "";
  if (t) { 
    stopRec(); 
    send(t); 
  }
});

$("#casque").addEventListener("change", () => { 
  if (session && $("#casque").checked && !rec) listen(); 
});

renderGauges();
</script>
