<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7E8E6">
<title>TARS pas tars</title>
<style>
  :root {
    color-scheme: light;
    --bg: #E7E8E6;
    --panel: #EFEFED;
    --text: #14171A;
    --mute: #3A3F45;
    --text-soft: #6E747A;
    --line: rgba(20, 23, 26, 0.14);
    --line-strong: #C9CCCF;
    --accent: #E39B2D;
    --accent-soft: rgba(227, 155, 45, 0.14);
    --on-accent: #14171A;
    --err: #A9472B;
    --err-soft: #F3E4DB;
    --bar-off: rgba(20, 23, 26, 0.12);
    --tars-text: #2A2E33;
    --font-display: "Bahnschrift", "DIN Alternate", "Franklin Gothic Medium", "Trebuchet MS", sans-serif;
    --font-body: "Candara", "Avenir Next", "Trebuchet MS", sans-serif;
    --font-mono: "Cascadia Mono", "Consolas", "Courier New", monospace;
    --radius: 24px;
    --radius-sm: 7px;
    --shadow: 0 28px 54px -38px rgba(20, 23, 26, 0.42);
    --tracking-display: 0.28em;
    --tracking-label: 0.14em;
    --dur: 220ms;
    --ease: cubic-bezier(0.2, 0.65, 0.25, 1);
    --gauge-humour: #3A3F45;
    --gauge-honnetete: #E39B2D;
    box-sizing: border-box;
  }

  *, *::before, *::after {
    box-sizing: inherit;
    margin: 0;
    padding: 0;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 var(--font-body);
  }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease);
  }

  ::selection {
    background: var(--accent-soft);
    color: var(--text);
  }

  /* En-tête */
  .masthead {
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px 16px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .masthead h1 {
    font-family: var(--font-display);
    font-size: clamp(20px, 4vw, 24px);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: var(--tracking-display);
    text-transform: uppercase;
    color: var(--text);
  }

  .masthead-title {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .masthead-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .gear {
    background: transparent;
    border: 0;
    padding: 2px 4px;
    font-size: 15px;
    line-height: 1;
    color: var(--mute);
    cursor: pointer;
    border-radius: 4px;
    transition: color 0.2s;
  }

  .gear:hover {
    color: var(--text);
  }

  .gear:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .sysline {
    color: var(--mute);
    font-size: 11px;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
  }

  .state-line {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--mute);
    font-size: 11px;
  }

  .rev {
    display: none;
  }

  .state-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--line-strong);
    transition: background 0.3s;
  }

  body[data-state="listening"] .state-dot { background: var(--accent); }
  body[data-state="thinking"] .state-dot  { background: var(--mute); }
  body[data-state="speaking"] .state-dot  { background: var(--accent); }
  body[data-state="recording"] .state-dot { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }

  /* Mode Widget */
  body.widget-mode {
    width: 200px;
    height: 120px;
    background: var(--panel);
    border-radius: 8px;
    padding: 8px;
    border: 1px solid var(--line);
  }
  body.widget-mode main {
    max-width: 100%;
    padding: 0;
    gap: 8px;
  }
  body.widget-mode #status {
    font-size: 11px;
    min-height: 1.2em;
    padding: 4px;
    border: 0;
  }
  body.widget-mode #slab {
    width: 50px;
    height: 50px;
  }
  body.widget-mode #slab i {
    height: 8px;
  }
  body.widget-mode .masthead,
  body.widget-mode #history,
  body.widget-mode #you,
  body.widget-mode #tars,
  body.widget-mode .talk,
  body.widget-mode .gauges,
  body.widget-mode form,
  body.widget-mode label.opt,
  body.widget-mode #gear,
  body.widget-mode #settings {
    display: none;
  }

  /* Mode embarqué (Electron/Capacitor) */
  body.embedded {
    padding: 0;
  }
  body.embedded main {
    padding: 10px;
  }

  /* Conteneur principal */
  main {
    width: 100%;
    max-width: 500px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 20px 16px;
    gap: 18px;
  }

  /* Statut */
  #status {
    margin: 0;
    color: var(--mute);
    min-height: 1.5em;
    text-align: center;
    font-size: 12px;
    padding: 8px 12px;
  }
  #status.err {
    color: var(--err);
  }

  /* Historique des conversations */
  #history {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 14px;
    line-height: 1.6;
    max-height: 300px;
    min-height: 100px;
    box-shadow: var(--shadow);
    transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  #history p {
    margin: 4px 0;
    animation: msgIn 0.2s ease-out both;
  }
  #history p strong {
    color: var(--text);
    font-weight: 600;
  }
  #history .user {
    color: var(--text);
  }
  #history .tars {
    color: var(--tars-text);
  }
  #history .tars strong {
    color: var(--text);
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }

  @keyframes msgIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Scène TARS */
  #scene {
    position: relative;
    width: 100%;
    min-height: 218px;
    padding: 8px 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: center;
  }

  #slab {
    position: relative;
    width: 161px;
    height: 187px;
    padding: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    cursor: pointer;
    overflow: visible;
    -webkit-tap-highlight-color: transparent;
    transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
  }

  #slab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 8px;
    border-radius: 2px;
  }

  #slab i {
    flex: 1 1 0;
    height: 100%;
    background: var(--line-strong);
    border: 0;
    border-radius: var(--radius-sm);
    transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }

  .scene-dim,
  .values-line {
    display: none;
  }

  @media (prefers-reduced-motion: reduce) {
    #slab i, #history p, .state-dot { animation: none !important; transition: none !important; }
  }

  /* Zone de discussion */
  .talk {
    width: 100%;
    min-height: 100px;
    padding: 18px 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }

  .talk p {
    margin: 8px 0;
    max-width: 100%;
    word-wrap: break-word;
  }

  #you {
    color: var(--mute);
    font-style: italic;
  }

  #tars {
    color: var(--tars-text);
    font-size: 15px;
    line-height: 1.25;
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  .talk small {
    display: block;
    color: var(--mute);
    font-size: 12px;
    margin-top: 8px;
  }

  /* Jauges de réglage */
  .gauges {
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
    padding: 0 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }

  .gauge-row {
    display: grid;
    grid-template-columns: 84px 1fr;
    gap: 16px;
    align-items: center;
    padding: 13px 0;
  }

  .gauge-row + .gauge-row {
    border-top: 1px solid var(--line);
  }

  .gauges span {
    color: var(--mute);
    font-size: 10px;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
  }

  .bar {
    display: grid;
    grid-template-columns: repeat(10, minmax(4px, 1fr)) auto;
    gap: 4px;
    align-items: center;
  }

  .bar b {
    height: 6px;
    background: var(--bar-off);
    border: 0;
    border-radius: 2px;
    transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }

  .bar b.on {
    background: var(--accent);
  }

  #g-humour b.on {
    background: var(--gauge-humour);
  }

  #g-honnetete b.on {
    background: var(--gauge-honnetete);
  }

  .bar::after {
    content: attr(title);
    color: var(--mute);
    font-size: 10px;
    letter-spacing: 0.04em;
    padding-left: 8px;
    white-space: nowrap;
  }

  /* Options */
  label.opt {
    display: flex;
    gap: 10px;
    align-items: center;
    color: var(--mute);
    font-size: 13px;
    cursor: pointer;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    transition: border-color 0.2s;
  }

  label.opt:hover {
    border-color: var(--line-strong);
  }

  label.opt input {
    accent-color: var(--accent);
  }

  /* Réglages */
  #settings {
    display: none;
    width: 100%;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    gap: 10px;
    flex-direction: column;
  }

  #settings.open {
    display: flex;
  }

  #settings .settings-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #settings .settings-row label {
    width: 74px;
    flex: none;
    color: var(--mute);
    font-size: 10px;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
  }

  #settings .settings-row input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
  }

  #settings .settings-row input:focus {
    outline: none;
    border-color: var(--accent);
  }

  #settings .settings-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  #settings .settings-status {
    color: var(--mute);
    font-size: 12px;
    flex: 1;
    min-width: 120px;
  }

  #settings .settings-status.ok {
    color: var(--accent);
  }

  #settings .settings-actions button {
    padding: 6px 14px;
    font-size: 12px;
  }

  button.clear {
    background: transparent;
    color: var(--mute);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font: inherit;
    cursor: pointer;
    transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }

  button.clear:hover {
    color: var(--err);
    border-color: var(--line-strong);
  }

  /* Formulaire */
  form {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  input[type=text] {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    font-size: 14px;
    transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
  }

  input[type=text]:focus {
    outline: none;
    border-color: var(--accent);
  }

  button.send {
    padding: 11px 18px;
    font: inherit;
    font-family: var(--font-display);
    color: var(--on-accent);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity var(--dur) var(--ease), transform 0.1s var(--ease), background-color var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }

  button.send:hover {
    opacity: 0.88;
  }

  button.send:active {
    transform: scale(0.97);
  }

  input:focus-visible,
  button.send:focus-visible,
  label.opt input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Animation de chargement */
  .loading {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid var(--line-strong);
    border-radius: 50%;
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .loading { animation: none !important; }
  }

  /* ---------- Valeurs + sélecteur de design ---------- */
  .values-line {
    width: 100%;
    color: var(--mute);
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .settings-design {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 2px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .settings-design .settings-label {
    color: var(--mute);
    font-size: 10px;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
  }

  .design-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .design-card {
    position: relative;
    display: grid;
    grid-template-columns: 88px minmax(0, 1fr);
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px;
    font: inherit;
    color: var(--text);
    text-align: left;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
  }

  .design-card:hover {
    border-color: var(--line-strong);
  }

  .design-card[aria-checked="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  .design-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .design-preview {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border: 1px solid rgba(20, 23, 26, 0.12);
  }

  .design-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .design-name {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .design-words {
    color: var(--mute);
    font-size: 10px;
    line-height: 1.35;
  }

  .swatches {
    display: flex;
    gap: 3px;
    margin-top: 2px;
  }

  .swatches i {
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid rgba(20, 23, 26, 0.14);
  }

  .design-check {
    position: absolute;
    top: 5px;
    right: 5px;
    display: none;
    width: 17px;
    height: 17px;
    place-items: center;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    font: 700 10px/1 var(--font-body);
  }

  .design-card[aria-checked="true"] .design-check {
    display: grid;
  }

  .design-status {
    min-height: 1.3em;
    color: var(--mute);
    font-size: 11px;
    line-height: 1.3;
  }

  .design-status.err {
    color: var(--err);
  }

  /* Aperçus fixes, indépendants du thème actif */
  .dp-monolithe {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: linear-gradient(180deg, #F1F2F0, #DFE1DE);
  }

  .dp-monolithe .dp-slab {
    width: 15%;
    height: 62%;
    border: 1px solid rgba(20, 23, 26, 0.13);
    border-radius: 2px;
    background: linear-gradient(90deg, #B6BABD, #F4F4F2 34%, #D0D3D1 72%, #A8ACAF);
    box-shadow: 0 5px 8px -6px rgba(20, 23, 26, 0.55);
  }

  .dp-monolithe .dp-slab:nth-child(1) { transform: translateY(4px); }
  .dp-monolithe .dp-slab:nth-child(2) { transform: translateY(-4px); }
  .dp-monolithe .dp-slab:nth-child(3) { transform: translateY(2px); }
  .dp-monolithe .dp-slab:nth-child(4) { transform: translateY(-2px); }

  .dp-led {
    position: absolute;
    bottom: 7%;
    left: 50%;
    width: 4px;
    height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: #E39B2D;
    box-shadow: 0 0 6px rgba(227, 155, 45, 0.8);
  }

  .dp-cyanotype {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background-color: #12306B;
    background-image:
      linear-gradient(to right, rgba(157, 182, 224, 0.24) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(157, 182, 224, 0.24) 1px, transparent 1px);
    background-size: 12px 12px;
  }

  .dp-wire {
    width: 12%;
    height: 62%;
    border: 1px solid #9DB6E0;
  }

  .dp-wire:nth-child(1) { transform: translateY(-2px); }
  .dp-wire:nth-child(2) { transform: translateY(2px); }
  .dp-wire:nth-child(3) { transform: translateY(-2px); }
  .dp-wire:nth-child(4) { transform: translateY(2px); }

  .dp-dim {
    position: absolute;
    right: 10%;
    bottom: 6px;
    left: 10%;
    padding-top: 2px;
    border-top: 1px solid #FF6B2C;
    color: #FF6B2C;
    font: 5px/1 var(--font-mono);
    letter-spacing: 0.06em;
    text-align: right;
  }

  .dp-editorial {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8px 9px;
    background: #F2F3F0;
  }

  .dp-recu {
    color: #7C8A96;
    font-family: "Bodoni 72", "Bodoni MT", Didot, "Iowan Old Style", Georgia, serif;
    font-size: 17px;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .dp-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
  }

  .dp-bars i {
    display: block;
    flex: 1;
    background: #2B2E33;
  }

  .dp-bars i:nth-child(1) { height: 55%; }
  .dp-bars i:nth-child(2) { height: 82%; }
  .dp-bars i:nth-child(3) { height: 44%; }
  .dp-bars i:nth-child(4) { height: 100%; background: #E4572E; }

  .design-card[data-choice="monolithe"] .swatches i:nth-child(1) { background: #E7E8E6; }
  .design-card[data-choice="monolithe"] .swatches i:nth-child(2) { background: #14171A; }
  .design-card[data-choice="monolithe"] .swatches i:nth-child(3) { background: #3A3F45; }
  .design-card[data-choice="monolithe"] .swatches i:nth-child(4) { background: #E39B2D; }
  .design-card[data-choice="monolithe"] .swatches i:nth-child(5) { background: #C9CCCF; }

<script>
"use strict";
const $ = s => document.querySelector(s);
const BACKEND_URL = `http://localhost:${new URLSearchParams(window.location.search).get('port') || 8000}`;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const NATIVE_TTS = !!(window.NativeTTS && typeof window.NativeTTS.speak === "function");
// Dans l'APK, la WebView expose SpeechRecognition mais il ne fournit pas de résultat fiable :
// on utilise toujours MediaRecorder + /stt (Groq Whisper), avec arrêt automatique sur silence.
const USE_SR = !!SR && !NATIVE_TTS;
const HAS_TTS = typeof window.speechSynthesis !== "undefined" && window.speechSynthesis;

let state = "off", session = false, rec = null, ctrl = null, wake = null;
let gen = 0, pending = 0, streaming = false, gotFirst = false, ackTimer = null, lastAck = "";
let sttCtrl = null;
let settings = { humour: 60, honnetete: 90 };
let voice = null;
let mediaStream = null, recorder = null, chunks = [];
let monitor = null, monitorStream = null, monitorAt = 0, monitorVad = null, monitorCtx = null, monitorBuf = null;
let monitorStarting = false;
let ttsSeq = 0, ttsIds = new Set();
let audioCtx = null, analyser = null, vadTimer = null, vadBuf = null;
let speechSeen = false, lastVoiceAt = 0, recStartedAt = 0, noiseFloor = null;
let recPending = false, srText = "", srFinalTimer = null;
let isWidget = new URLSearchParams(location.search).has("widget");

// Détecter si on est en mode embarqué
const isEmbedded = (
  typeof window.electronAPI !== 'undefined' ||
  (window.Capacitor && window.Capacitor.getPlatform() !== 'web')
);
if (isEmbedded) {
  document.body.classList.add('embedded');
}

// Base des appels API (même origine en web et dans Electron, backend local sinon)
const apiBase = () => (location.protocol === "http:" || location.protocol === "https:")
  ? location.origin
  : BACKEND_URL;

// Activer le mode widget si demandé
if (isWidget) {
  document.body.classList.add("widget-mode");
}

/* ---------- Affichage ---------- */
const LABELS = {
  off: "Appuyez sur TARS, commandant.",
  listening: "Je vous écoute, commandant.",
  thinking: "Réflexion en cours...",
  speaking: "",
  recording: "J'enregistre…"
};

function setState(s) {
  state = s;
  document.body.dataset.state = s;
  if (LABELS[s] !== undefined) note(LABELS[s]);
}

function note(msg, err) {
  const el = $("#status"); 
  el.textContent = msg; 
  el.classList.toggle("err", !!err);
}

function renderGauges() {
  for (const k of ["humour", "honnetete"]) {
    const n = Math.round(settings[k] / 10), el = $("#g-" + k);
    el.setAttribute("title", settings[k] + " %");
    el.innerHTML = Array.from({ length: 10 }, (_, i) => `<b class="${i < n ? "on" : ""}"></b>`).join("");
  }
  const values = $("#values");
  if (values) values.textContent = `Humour ${settings.humour} · Honnêteté ${settings.honnetete}`;
}

/* ---------- Design ---------- */
const DESIGNS = ["monolithe", "cyanotype", "editorial"];
const THEME_COLORS = {
  monolithe: "#E7E8E6",
  cyanotype: "#12306B",
  editorial: "#F2F3F0",
};
let currentDesign = "monolithe";
let designTouched = false;
let designQueue = Promise.resolve();
let designSeq = 0;
let desiredDesign = currentDesign;
let savedDesign = currentDesign;

function setDesignStatus(message, isError) {
  const el = $("#design-status");
  if (!el) return;
  el.textContent = message || "";
  el.classList.toggle("err", !!isError);
}

function applyDesign(name, options = {}) {
  if (!DESIGNS.includes(name)) name = "monolithe";
  currentDesign = name;
  document.documentElement.dataset.design = name;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", THEME_COLORS[name]);
  document.querySelectorAll(".design-card").forEach(card => {
    const selected = card.dataset.choice === name;
    card.setAttribute("aria-checked", selected ? "true" : "false");
    card.tabIndex = selected ? 0 : -1;
  });
  if (options.status !== undefined) setDesignStatus(options.status, options.error);
  return name;
}

async function saveDesign(name, seq) {
  try {
    const response = await fetch(`${apiBase()}/design`, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ design: name }),
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || ("HTTP " + response.status));
    savedDesign = name;
    if (desiredDesign === name && seq === designSeq) setDesignStatus("Enregistré");
  } catch (error) {
    if (desiredDesign !== name || seq !== designSeq) return;
    applyDesign(savedDesign);
    setDesignStatus("Erreur : design non enregistré", true);
  }
}

function chooseDesign(name) {
  if (!DESIGNS.includes(name) || name === currentDesign) return;
  designTouched = true;
  desiredDesign = name;
  const seq = ++designSeq;
  applyDesign(name, { status: "Enregistrement…" });
  designQueue = designQueue.then(() => {
    if (desiredDesign !== name || seq !== designSeq) return;
    return saveDesign(name, seq);
  }).catch(() => {});
}

const designCards = Array.from(document.querySelectorAll(".design-card"));

function focusDesignCard(index) {
  const card = designCards[(index + designCards.length) % designCards.length];
  card.focus();
  chooseDesign(card.dataset.choice);
}

designCards.forEach((card, index) => {
  card.addEventListener("click", () => chooseDesign(card.dataset.choice));
  card.addEventListener("keydown", event => {
    let target = null;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") target = index + 1;
    else if (event.key === "ArrowLeft" || event.key === "ArrowUp") target = index - 1;
    else if (event.key === "Home") target = 0;
    else if (event.key === "End") target = designCards.length - 1;
    if (target === null) return;
    event.preventDefault();
    focusDesignCard(target);
  });
});

applyDesign(DESIGNS.includes(document.documentElement.dataset.design) ? document.documentElement.dataset.design : "monolithe");
savedDesign = currentDesign;
desiredDesign = currentDesign;

/* ---------- Historique ---------- */
function addToHistory(userText, tarsText) {
  const historyDiv = $("#history");
  if (userText) {
    const userPara = document.createElement('p');
    userPara.className = 'user';
    userPara.innerHTML = '<strong>Toi:</strong> ';
    userPara.appendChild(document.createTextNode(userText));
    historyDiv.appendChild(userPara);
  }
  if (tarsText) {
    const tarsPara = document.createElement('p');
    tarsPara.className = 'tars';
    tarsPara.innerHTML = '<strong>TARS:</strong> ';
    tarsPara.appendChild(document.createTextNode(tarsText));
    historyDiv.appendChild(tarsPara);
  }
  historyDiv.scrollTop = historyDiv.scrollHeight;
}

/* ---------- Synthèse vocale ---------- */
const ACK_AUDIO = {
  court: [],
  reflexion: [],
  drole: []
};

function loadAudioClips() {
  const dummyClips = {
    court: ["recu", "mmh", "compris", "bien_recu", "ok"],
    reflexion: ["hm_voyons", "une_seconde", "je_reflechis", "laissez_moi_verifier", "attendez"],
    drole: ["recu_je_fais_semblant_d_etre_surpris", "mmh_passionnant", "compris_evidemment", "bien_recu_enfin", "ok_si_vous_le_dites"]
  };
  for (const [category, clips] of Object.entries(dummyClips)) {
    clips.forEach(clip => {
      const audio = new Audio(`${apiBase()}/static/acks/${category}/${clip}.mp3`);
      audio.preload = "auto";
      let triedWav = false;
      audio.onerror = () => {
        if (!triedWav && !audio.src.endsWith(".wav")) {
          triedWav = true;
          audio.src = audio.src.replace(/\.mp3$/, ".wav");
        } else {
          console.warn(`Clip audio non trouvé: ${category}/${clip}`);
        }
      };
      ACK_AUDIO[category].push(audio);
    });
  }
}

function pickAck(text) {
  const long = text.length > 80 || /expliqu|pourquoi|comment|compar/i.test(text);
  let pool = long ? ACK_AUDIO.reflexion : ACK_AUDIO.court;
  if (settings.humour >= 70) pool = pool.concat(ACK_AUDIO.drole);
  if (settings.humour <= 30) pool = ACK_AUDIO.court.slice(0, 2);
  
  const available = pool.filter(a => a.src !== lastAck);
  if (available.length === 0) return pool[0];
  
  const clip = available[Math.floor(Math.random() * available.length)];
  lastAck = clip.src;
  return clip;
}

function pickVoice() {
  if (!HAS_TTS) return;
  const vs = window.speechSynthesis.getVoices();
  voice = vs.find(v => /^fr.*Male/i.test(v.name)) || 
          vs.find(v => /Google fr-FR Standard A/i.test(v.name)) ||
          vs.find(v => /Microsoft.*French.*Male/i.test(v.name)) ||
          vs.find(v => /^fr[-_]FR/i.test(v.lang)) || 
          vs.find(v => /^fr/i.test(v.lang)) || null;
}

if (HAS_TTS) { 
  pickVoice(); 
  window.speechSynthesis.onvoiceschanged = pickVoice; 
}

function say(text) {
  if (isWidget) return;
  fallbackTTS(text);
}

function playAck() {
  if (isWidget) return;
  const clip = pickAck('');
  if (clip) {
    clip.currentTime = 0;
    const p = clip.play();
    if (p !== undefined) p.catch(() => {});
  }
}

function fallbackTTS(text) {
  if (HAS_TTS) {
    const g = gen, u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; 
    if (voice) u.voice = voice;
    u.pitch = 0.5; u.rate = 0.85;
    const done = () => { 
      if (g !== gen) return; 
      pending = Math.max(0, pending - 1); 
      maybeResume(); 
    };
    u.onend = done; 
    u.onerror = done;
    pending++; 
    window.speechSynthesis.speak(u);
    return;
  }
  if (!window.NativeTTS || typeof window.NativeTTS.speak !== "function") return;
  const id = `tts-${++ttsSeq}`;
  ttsIds.add(id);
  window.onNativeTTSDone = doneId => {
    if (!ttsIds.has(doneId)) return;
    ttsIds.delete(doneId);
    pending = Math.max(0, pending - 1);
    maybeResume();
  };
  pending++;
  try {
    window.NativeTTS.speak(text, id);
  } catch (e) {
    ttsIds.delete(id);
    pending = Math.max(0, pending - 1);
  }
}

/* ---------- Reconnaissance vocale ---------- */
function stopRec() { 
  const r = rec; 
  rec = null; 
  if (r) { try { r.abort(); } catch (e) {} } 
}

function wantsMic() { 
  return session; 
}

function listen() {
  if (!USE_SR || !session) return;
  clearTimeout(srFinalTimer);
  srText = "";
  stopRec();
  const me = new SR(); rec = me;
  me.lang = "fr-FR"; 
  me.interimResults = true; 
  me.continuous = false;
  me.onresult = e => {
    if (rec !== me) return;
    let txt = "", fin = false;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      txt += e.results[i][0].transcript; 
      if (e.results[i].isFinal) fin = true;
    }
    if (state !== "listening" && txt.trim().length > 2) interrupt(false);
    if (state === "listening") $("#you").textContent = txt;
    if (fin && state === "listening") { 
      clearTimeout(srFinalTimer);
      srText = "";
      stopRec(); 
      send(txt.trim()); 
      return;
    }
    if (txt.trim()) {
      srText = txt;
      clearTimeout(srFinalTimer);
      srFinalTimer = setTimeout(() => {
        if (rec === me && state === "listening" && srText.trim()) {
          stopRec();
          send(srText.trim());
          srText = "";
        }
      }, 1600);
    }
  };
  me.onerror = e => {
    if (rec !== me) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      note("Micro refusé. Autorisez-le dans les réglages du site.", true);
      endSession();
    }
  };
  me.onend = () => { 
    clearTimeout(srFinalTimer);
    if (rec === me && wantsMic()) setTimeout(() => { if (rec === me) listen(); }, 150); 
  };
  try { me.start(); } catch (e) { /* déjà démarré */ }
}

/* ---------- Enregistrement micro (sans SpeechRecognition) ---------- */
function cleanupVad() {
  clearInterval(vadTimer);
  vadTimer = null;
  if (audioCtx) audioCtx.close().catch(() => {});
  audioCtx = null;
  analyser = null;
  vadBuf = null;
}

function stopStream() {
  cleanupVad();
  if (!mediaStream) return;
  mediaStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
  mediaStream = null;
}

/* ---------- Écoute de veille (interruption pendant la parole) ---------- */
function stopMonitor(keepStream) {
  clearInterval(monitorVad); monitorVad = null;
  if (monitorCtx) { try { monitorCtx.close(); } catch (e) {} monitorCtx = null; }
  monitorBuf = null;
  if (monitor) { try { monitor.ondataavailable = null; monitor.stop(); } catch (e) {} monitor = null; }
  if (!keepStream && monitorStream) {
    monitorStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    monitorStream = null;
  }
}

async function startBargeMonitor() {
  if (!session || USE_SR || monitor || monitorStarting || recorder || recPending) return;
  if (!navigator.mediaDevices || typeof MediaRecorder === "undefined") return;
  monitorStarting = true;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) { monitorStarting = false; return; }
  monitorStarting = false;
  if (!session || recorder || recPending) { stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); return; }
  monitorStream = stream;
  try { monitor = new MediaRecorder(stream); } catch (e) { stopMonitor(); return; }
  monitor.ondataavailable = () => {};
  try { monitor.start(); } catch (e) { stopMonitor(); return; }
  monitorAt = Date.now();
  startMonitorVad();
}

function startMonitorVad() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) { stopMonitor(); return; }
  let analyser;
  try {
    monitorCtx = new Ctx();
    if (monitorCtx.state === "suspended") monitorCtx.resume().catch(() => {});
    const src = monitorCtx.createMediaStreamSource(monitorStream);
    analyser = monitorCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.6;
    src.connect(analyser);
    monitorBuf = new Uint8Array(analyser.fftSize);
  } catch (e) { stopMonitor(); return; }
  let noise = null, frames = 0;
  monitorVad = setInterval(() => {
    if (!monitor || !monitorCtx || !monitorBuf) { stopMonitor(); return; }
    if (Date.now() - monitorAt > 20000) {
      if (state === "speaking" || state === "thinking") { monitorAt = Date.now(); }
      else { stopMonitor(); return; }
    }
    analyser.getByteTimeDomainData(monitorBuf);
    let sum = 0;
    for (let i = 0; i < monitorBuf.length; i++) { const d = (monitorBuf[i] - 128) / 128; sum += d * d; }
    const rms = Math.sqrt(sum / monitorBuf.length);
    if (noise === null && Date.now() - monitorAt < 400) noise = rms;
    const threshold = Math.max(0.02, Math.min(noise === null ? 0.05 : noise, 0.05) * 2.5);
    if (rms > threshold) frames++; else frames = 0;
    if (frames >= 2 && (state === "speaking" || state === "thinking")) {
      bargeIn();
      return;
    }
  }, 100);
}

function bargeIn() {
  const stream = monitorStream;
  stopMonitor(true);
  monitorStream = null;
  interrupt(false);
  if (stream) startRecording(stream, true);
}

function startVad(stream, assumeSpeech) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audioCtx = new Ctx();
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.6;
  src.connect(analyser);
  vadBuf = new Uint8Array(analyser.fftSize);
  speechSeen = !!assumeSpeech;
  lastVoiceAt = assumeSpeech ? Date.now() : 0;
  noiseFloor = 0.008;
  recStartedAt = Date.now();
  vadTimer = setInterval(() => {
    if (!recorder || !analyser) { cleanupVad(); return; }
    analyser.getByteTimeDomainData(vadBuf);
    let sum = 0;
    for (let i = 0; i < vadBuf.length; i++) { const d = (vadBuf[i] - 128) / 128; sum += d * d; }
    const rms = Math.sqrt(sum / vadBuf.length);
    const now = Date.now();
    const threshold = Math.max(0.012, (noiseFloor || 0) * 2.5);
    if (rms > threshold) { speechSeen = true; lastVoiceAt = now; }
    if (!speechSeen && now - recStartedAt > 8000) { cleanupVad(); stopRecording(true); setState("listening"); note("Rien entendu, commandant.", true); return; }
    if (speechSeen && now - lastVoiceAt > 1200) { cleanupVad(); stopRecording(); return; }
    if (now - recStartedAt > 15000) { cleanupVad(); stopRecording(); return; }
  }, 100);
}

async function startRecording(existingStream, assumeSpeech) {
  if (recPending) return;
  if (!session || recorder) return;
  if (!existingStream && (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function" ||
      typeof MediaRecorder === "undefined")) {
    setState("listening");
    note("Micro indisponible : utilisez le champ texte.", true);
    return;
  }
  if (existingStream && typeof MediaRecorder === "undefined") {
    existingStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    setState("listening");
    note("Enregistrement indisponible sur cet appareil.", true);
    return;
  }
  recPending = true;
  let stream = existingStream || null;
  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
      recPending = false;
      setState("listening");
      note("Micro refusé. Autorisez-le dans les réglages de l'application.", true);
      return;
    }
  }
  recPending = false;
  if (existingStream) monitorStream = null;
  if (!session) {
    stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    return;
  }
  mediaStream = stream;
  chunks = [];
  let mr;
  try {
    mr = new MediaRecorder(stream);
  } catch (e) {
    stopStream();
    setState("listening");
    note("Enregistrement indisponible sur cet appareil.", true);
    return;
  }
  recorder = mr;
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    const discard = !!mr._discard;
    const type = mr.mimeType || "audio/webm";
    const blob = new Blob(chunks, { type });
    chunks = [];
    if (recorder === mr) recorder = null;
    stopStream();
    if (session && !USE_SR && (state === "thinking" || state === "speaking")) startBargeMonitor();
    if (discard) return;
    if (blob.size < 1500) { setState("listening"); return; }
    transcribe(blob, type);
  };
  try {
    mr.start();
  } catch (e) {
    recorder = null;
    stopStream();
    setState("listening");
    note("Impossible de démarrer l'enregistrement.", true);
    return;
  }
  startVad(stream, assumeSpeech);
  setState("recording");
}

function stopRecording(discard) {
  if (!recorder) return;
  if (discard) recorder._discard = true;
  try { recorder.stop(); } catch (e) {}
}

async function transcribe(blob, type) {
  setState("thinking");
  if (sttCtrl) sttCtrl.abort();
  const c = sttCtrl = new AbortController();
  const g0 = gen;
  try {
    const r = await fetch(`${apiBase()}/stt`, {
      method: "POST",
      signal: c.signal,
      headers: { "Content-Type": type },
      body: blob,
    });
    if (!session || c.signal.aborted || sttCtrl !== c || g0 !== gen) return;
    if (!r.ok) {
      let msg = "Transcription impossible.";
      try {
        const j = await r.json();
        if (j && j.error) msg = j.error;
      } catch (e) {}
      if (!session || c.signal.aborted || sttCtrl !== c || g0 !== gen) return;
      note(msg, true);
      setState("listening");
      return;
    }
    const j = await r.json();
    if (!session || c.signal.aborted || sttCtrl !== c || g0 !== gen) return;
    const text = (j && typeof j.text === "string" ? j.text : "").trim();
    if (!text) {
      note("Rien entendu, commandant.", true);
      setState("listening");
      return;
    }
    $("#you").textContent = text;
    send(text);
  } catch (e) {
    if (e.name === "AbortError" || sttCtrl !== c) return;
    note("Transcription impossible : backend injoignable.", true);
    setState("listening");
  } finally {
    if (sttCtrl === c) sttCtrl = null;
  }
}

/* ---------- Flux conversation ---------- */
function maybeResume() {
  if (streaming || pending > 0 || !session) return;
  setState("listening");
  if (USE_SR) { if (!rec) listen(); }
  else if (monitor) {
    const s = monitorStream;
    stopMonitor(true);
    monitorStream = null;
    if (s) startRecording(s);
  }
  else if (!recorder && !recPending) startRecording();
}

function interrupt(resume = true) {
  stopMonitor();
  if (sttCtrl) { sttCtrl.abort(); sttCtrl = null; }
  gen++; 
  pending = 0; 
  ttsIds.clear();
  streaming = false; 
  clearTimeout(ackTimer);
  if (ctrl) ctrl.abort();
  if (HAS_TTS) window.speechSynthesis.cancel();
  if (window.NativeTTS && typeof window.NativeTTS.stop === "function") {
    try { window.NativeTTS.stop(); } catch (e) {}
  }
  if (!session) { setState("off"); return; }
  setState("listening");
  if (resume && session) {
    if (USE_SR) { if (!rec) listen(); }
    else if (!recorder && !recPending) startRecording();
  }
}

function onEvent(ev, g) {
  if (g !== gen) return;
  if (ev.s) {
    if (!gotFirst) { 
      gotFirst = true; 
      clearTimeout(ackTimer); 
      setState("speaking");
      startBargeMonitor();
      addToHistory($("#you").textContent, ev.s);
    } else {
      addToHistory("", ev.s);
    }
    $("#tars").textContent += (ev.error ? "" : ($("#tars").textContent ? " " : "")) + ev.s;
    say(ev.s);
  }
  startBargeMonitor();
  if (ev.error) note(ev.error, true);
  if (ev.done && ev.settings) { 
    settings = ev.settings; 
    renderGauges(); 
  }
}

async function send(text) {
  if (!text) { maybeResume(); return; }
  interrupt(false);
  const g = gen;
  $("#you").textContent = text; 
  $("#tars").textContent = "";
  setState("thinking"); 
  startBargeMonitor();
  streaming = true; 
  gotFirst = false;
  ackTimer = setTimeout(() => { 
    if (!gotFirst && g === gen) playAck(); 
  }, 250);
  ctrl = new AbortController();
  
  try {
    const r = await fetch(`${apiBase()}/chat`, {
      method: "POST", 
      signal: ctrl.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) {
      throw new Error("Backend non disponible");
    }
    const rd = r.body.getReader(), dec = new TextDecoder(); 
    let buf = "";
    for (;;) {
      const { value, done } = await rd.read(); 
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); 
        buf = buf.slice(i + 1);
        if (line) onEvent(JSON.parse(line), g);
      }
    }
  } catch (e) {
    if (e.name !== "AbortError" && g === gen) {
      note("Mode local : backend non disponible.", true);
      const reply = `Je suis en mode local. Vous avez dit : "${text}".`;
      say(reply);
      addToHistory(text, reply);
      if (g === gen) { 
        streaming = false; 
        clearTimeout(ackTimer); 
        maybeResume(); 
      }
    }
  } finally {
    if (g === gen) { 
      streaming = false; 
      clearTimeout(ackTimer); 
      maybeResume(); 
    }
  }
}

/* ---------- Session ---------- */
async function startSession() {
  if (!USE_SR && (typeof MediaRecorder === "undefined" || !navigator.mediaDevices)) { 
    note("Reconnaissance vocale absente. Utilisez le champ texte.", true); 
    return; 
  }
  
  session = true; 
  setState("listening"); 
  if (USE_SR) listen();
  else startRecording();
  try { wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

function endSession() {
  session = false; 
  interrupt(false); 
  stopMonitor();
  stopRec();
  stopRecording(true);
  setState("off");
  if (wake) { 
    wake.release().catch(() => {}); 
    wake = null; 
  }
}

/* ---------- Raccourcis clavier ---------- */
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    $("#slab").click();
  }
  if (e.key === 'Escape') {
    endSession();
  }
});

/* ---------- Initialisation ---------- */
loadAudioClips();

fetch(apiBase() + "/state")
  .then(r => r.ok ? r.json() : null)
  .then(s => { 
    if (s) { 
      settings = s; 
      renderGauges(); 
      if (s.design && !designTouched) {
        currentDesign = applyDesign(s.design);
        savedDesign = currentDesign;
        desiredDesign = currentDesign;
      }
    } 
  })
  .catch(() => {});

// Mettre à jour le widget régulièrement
if (isWidget) {
  setInterval(() => {
    fetch(`${apiBase()}/widget`)
      .then(r => r.json())
      .then(data => {
        if (data.status) {
          note(`TARS: ${data.status}`);
        }
      })
      .catch(() => {});
  }, 1000);
}

/* ---------- Réglages clé API ---------- */
async function loadConfig() {
  const el = $("#groq-status");
  try {
    const r = await fetch(`${apiBase()}/config`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const c = await r.json();
    if (c && typeof c.groq_model === "string" && c.groq_model) {
      $("#groq-model").value = c.groq_model;
    }
    el.textContent = c && c.has_groq ? "Clé Groq : configurée" : "Clé Groq : absente";
    el.classList.toggle("ok", !!(c && c.has_groq));
  } catch (e) {
    el.textContent = "Réglages indisponibles";
    el.classList.remove("ok");
  }
}

async function saveConfig(extra) {
  const el = $("#groq-status");
  const payload = { groq_model: $("#groq-model").value.trim() };
  const key = $("#groq-key").value.trim();
  if (key) payload.groq_api_key = key;
  Object.assign(payload, extra || {});
  el.textContent = "Enregistrement…";
  el.classList.remove("ok");
  try {
    const r = await fetch(`${apiBase()}/config`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    $("#groq-key").value = "";
    el.textContent = "Enregistré";
    el.classList.add("ok");
    setTimeout(loadConfig, 1200);
  } catch (e) {
    el.textContent = "Erreur : " + (e.message || "enregistrement impossible");
    el.classList.remove("ok");
  }
}

/* ---------- Panneau réglages ---------- */
$("#gear").addEventListener("click", () => {
  const open = $("#settings").classList.toggle("open");
  if (open) loadConfig();
});

$("#save-config").addEventListener("click", () => saveConfig());

$("#clear-key").addEventListener("click", () => {
  $("#groq-key").value = "";
  saveConfig({ groq_api_key: "" });
});

/* ---------- Événements ---------- */
$("#slab").addEventListener("click", () => {
  if (!session) {
    if (state === "off") startSession();
    else interrupt(false);
    return;
  }
  if (state === "off") startSession();
  else if (state === "thinking" || state === "speaking") interrupt(true);
  else if (state === "recording") stopRecording();
  else if (!USE_SR) startRecording();
  else endSession();
});

$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("#txt").value.trim(); 
  $("#txt").value = "";
  if (t) { 
    stopRec(); 
    stopRecording(true);
    send(t); 
  }
});

renderGauges();
loadConfig();
</script>
